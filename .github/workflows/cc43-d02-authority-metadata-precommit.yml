name: CC43 D02 Authority Metadata Precommit Qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc43-d02-authority-metadata-precommit.yml'

permissions:
  contents: read

concurrency:
  group: emcore-cc43-d02-authority-metadata-precommit
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact EMCORE pre-correction head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: ccc68192c8774be5fdafba50b2ca8d83b182fc86
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact baseline and sole PR
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ccc68192c8774be5fdafba50b2ca8d83b182fc86"
          test "$(git rev-parse 'HEAD^{tree}')" = "0c248f02daddd871ec7bddd4b0e512b9b235b2b2"
          git cat-file -e ca224673f3a94227a85ba1303a420a18b726673a^{commit}
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1094||p[0].head.sha!=="ccc68192c8774be5fdafba50b2ca8d83b182fc86"||p[0].base.sha!=="ca224673f3a94227a85ba1303a420a18b726673a")process.exit(2);console.log("OPEN_PR_IDENTITY=PASS")})'

      - name: Apply proposed bounded SQL correction in runner workspace only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'supabase/migrations/20260922103000_d02_energy_manager_completeness.sql';
          const src = fs.readFileSync(p,'utf8');
          const before = "'validation_status',sc.validation_status,'confidence',sc.confidence";
          const after = `'validation_status',sc.validation_status,'confidence',sc.confidence,
                'authority_class',case
                  when sc.source_type in ('SII_CHECK_POD','SII_RCU','DISTRIBUTOR')
                    and sc.validation_status='VALIDATED'
                    and sc.source_provenance_id is not null then 'INDEPENDENT_TECHNICAL'
                  when sc.source_type in ('CONTRACT','CTE','ADDENDUM') then 'CONTRACTUAL'
                  when sc.source_type='INVOICE' then 'BILLED_OBSERVATION'
                  when sc.source_type='CLIENT' then 'CUSTOMER_REPORTED'
                  when sc.source_type='SYNTHETIC' then 'DEV_SYNTHETIC'
                  else 'UNCLASSIFIED'
                end`;
          const occurrences = src.split(before).length - 1;
          if (occurrences !== 1) throw new Error('expected exactly one projection anchor, found '+occurrences);
          fs.writeFileSync(p, src.replace(before, after));
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "supabase/migrations/20260922103000_d02_energy_manager_completeness.sql"
          git diff --check

      - name: Static authority metadata contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f=supabase/migrations/20260922103000_d02_energy_manager_completeness.sql
          grep -q "'authority_class',case" "$f"
          for v in INDEPENDENT_TECHNICAL CONTRACTUAL BILLED_OBSERVATION CUSTOMER_REPORTED DEV_SYNTHETIC UNCLASSIFIED; do
            grep -q "'$v'" "$f"
          done
          grep -q "sc.source_type in ('SII_CHECK_POD','SII_RCU','DISTRIBUTOR')" "$f"
          grep -q "sc.validation_status='VALIDATED'" "$f"
          grep -q "sc.source_provenance_id is not null then 'INDEPENDENT_TECHNICAL'" "$f"
          grep -q "sc.source_type='INVOICE' then 'BILLED_OBSERVATION'" "$f"
          if grep -q "sc.source_type='INVOICE' then 'INDEPENDENT_TECHNICAL'" "$f"; then exit 3; fi
          grep -q "when (select count(distinct sc.value_signature)" "$f"
          grep -q "then 'CONFLICTING'" "$f"
          echo "AUTHORITY_METADATA_STATIC_CONTRACT=PASS"
          echo "AUTHORITY_IS_METADATA_NOT_WINNER=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Previously failing D02 authority/context test file
        working-directory: source
        run: node --experimental-strip-types --test tests/d02-energy-manager-completeness.test.ts

      - name: Full canonical npm run check
        working-directory: source
        run: npm run check

      - name: Relevant D02 focused suite
        working-directory: source
        run: |
          node --experimental-strip-types --test             tests/d02-energy-manager-completeness.test.ts             tests/supply-profile-facts.test.ts             tests/sii-check-pod-d02.test.ts             tests/gas-rcu-fields.test.ts             tests/gas-rcu-commercial-capacity-semantics.test.ts             tests/gas-rcu-commercial-settlement-semantics.test.ts

      - name: Final non-destructive boundary assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "supabase/migrations/20260922103000_d02_energy_manager_completeness.sql"
          git diff --check
          echo "PRECOMMIT_PATCH_BOUNDARY=PASS"
          echo "NO_MERGE=PASS"
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
