name: P3 Controlli Azioni Exact-Head Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p3-controlli-azioni-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Harness boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" = "main"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          test "$changed" = ".github/workflows/p3-controlli-azioni-qualification.yml"
          echo "NO_DEPLOYMENT_OR_LIVE_MUTATION_COMMANDS=PASS"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: b9cb603919d867faad5b58e994c23714fa2e5968
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and bounded diff
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b9cb603919d867faad5b58e994c23714fa2e5968"
          test "$(git rev-parse 'HEAD^{tree}')" = "29ec3858402773245ebce51d75202a290120b18e"
          changed="$(git diff --name-only c849a4e206690e73ecbd848fec5690b45f166104..HEAD)"
          expected="$(printf '%s\n' 'apps/web/src/ProductPreviewV02App.tsx' 'apps/web/src/product-preview-v02.css')"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Verify governed files immutable
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for f in             apps/web/src/FornitureV04Cleanroom.tsx             apps/web/src/forniture-v04-cleanroom.css             apps/web/src/product-preview-visual-v13.css             apps/web/src/portal-navigation.ts             apps/web/src/product-preview-data.ts             apps/web/src/portal-data-source.ts             apps/web/src/workspace-source.ts             apps/web/src/product-preview-technical-facts.ts
          do
            git diff --quiet c849a4e206690e73ecbd848fec5690b45f166104..HEAD -- "$f"
          done

      - name: Verify TSX wrapper isolation
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/ProductPreviewV02App.tsx"
          test "$(git diff --numstat c849a4e206690e73ecbd848fec5690b45f166104..HEAD -- "$f")" = $'2\t2\tapps/web/src/ProductPreviewV02App.tsx'
          grep -q 'emcore-v02__stack emcore-v02__page--controls' "$f"
          grep -q 'emcore-v02__stack emcore-v02__page--actions' "$f"
          test "$(grep -c 'emcore-v02__page--controls' "$f")" -eq 1
          test "$(grep -c 'emcore-v02__page--actions' "$f")" -eq 1
          git show c849a4e206690e73ecbd848fec5690b45f166104:"$f" > /tmp/before.tsx
          sed 's/ emcore-v02__page--controls//; s/ emcore-v02__page--actions//' "$f" > /tmp/after-normalized.tsx
          cmp -s /tmp/before.tsx /tmp/after-normalized.tsx

      - name: Verify P3 CSS scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/product-preview-v02.css"
          grep -q 'P3 CONTROLLI + COSA FARE' "$f"
          grep -q '.emcore-v02__page--controls .emcore-v02__table-head' "$f"
          grep -q '.emcore-v02__page--actions .emcore-v02__action-hero' "$f"
          grep -q '.emcore-v02__page--actions .emcore-v02__action-row.is-selected' "$f"
          awk '
            /P3 CONTROLLI \+ COSA FARE/{flag=1}
            flag && /^[[:space:]]*\.emcore-v02__/ && $0 !~ /page--controls|page--actions/ {
              print "UNSCOPED_P3_SELECTOR: " $0
              bad=1
            }
            END { exit bad }
          ' "$f"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Verify P3 present in runtime bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist
          grep -R -q -- ".emcore-v02__page--controls" apps/web/dist
          grep -R -q -- ".emcore-v02__page--actions" apps/web/dist
          grep -R -q -- "--emcore-v13-row-selected-start" apps/web/dist

      - name: Governed safety boundary
        shell: bash
        run: |
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_OUT_OF_SCOPE_PAGE_PROPAGATION=PASS"
          echo "NO_FORNITURE_REWIRE=PASS"
          echo "NO_DOMAIN_DATA_AUTH_RLS_SCHEMA_MUTATION=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "P3_CONTROLLI_AZIONI=QUALIFICATION_PASS"
