name: EMCORE Q2 Governed PILOT Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - q2-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q2-pilot-deploy
  cancel-in-progress: false

jobs:
  deploy-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate Q2 request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('q2-request.json', 'utf8'));
          const required = {
            schema: 'emcore.q2-request.v1',
            source_repository: 'emcore-project/emcore',
            release_commit: 'f57337c622d533a0200e51fcdf798deae5130754',
            release_tree: 'cd36bfbf4dc333b8d144b847ab13e169e183eae9',
            expected_open_pr_count: 0,
            target_worker: 'emcore-web-pilot',
            target_config: 'apps/web/wrangler.pilot.jsonc',
            pilot_base_url: 'https://emcore-web-pilot.emcore-project.workers.dev',
            zero_cost_required: true,
            document_ingestion_enabled: false,
          };
          for (const [key, value] of Object.entries(required)) {
            if (request[key] !== value) throw new Error(`q2-request mismatch for ${key}`);
          }
          if (!['IDLE', 'DEPLOY'].includes(request.mode)) {
            throw new Error('q2-request mode must be IDLE or DEPLOY');
          }
          if (request.mode === 'IDLE' && request.deployment_authorized !== false) {
            throw new Error('IDLE request cannot authorize deployment');
          }
          if (request.mode === 'DEPLOY' && request.deployment_authorized !== true) {
            throw new Error('DEPLOY request must explicitly authorize deployment');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${request.mode}\n`);
          NODE

      - name: Stop safely while IDLE
        if: steps.request.outputs.mode == 'IDLE'
        shell: bash
        run: echo "Q2 is prepared but not activated. No Cloudflare mutation was attempted."

      - name: Require governed secrets
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$EMCORE_SOURCE_TOKEN" || { echo "EMCORE_SOURCE_TOKEN missing; fail closed."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing; fail closed."; exit 1; }

      - name: Checkout exact private EMCORE source
        if: steps.request.outputs.mode == 'DEPLOY'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: f57337c622d533a0200e51fcdf798deae5130754
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        working-directory: source
        run: |
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_commit" = "f57337c622d533a0200e51fcdf798deae5130754" || { echo "Commit drift; fail closed."; exit 1; }
          test "$actual_tree" = "cd36bfbf4dc333b8d144b847ab13e169e183eae9" || { echo "Tree drift; fail closed."; exit 1; }
          echo "Exact accepted source identity verified."

      - name: Verify zero open source pull requests
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          count="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')"
          test "$count" = "0" || { echo "Open pull requests detected; fail closed."; exit 1; }
          echo "Open pull request count verified at zero."

      - name: Set up Node
        if: steps.request.outputs.mode == 'DEPLOY'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact source dependencies
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Re-run PILOT readiness gate
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        run: npm run check:pilot-readiness

      - name: Re-run release hardening gate
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        run: npm run check:release-hardening

      - name: Re-run canonical predeploy gate
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        env:
          EMCORE_RELEASE_COMMIT: f57337c622d533a0200e51fcdf798deae5130754
          EMCORE_RELEASE_TREE: cd36bfbf4dc333b8d144b847ab13e169e183eae9
          EMCORE_OPEN_RELEASE_PRS: '0'
          EMCORE_C6_ACCEPTED: 'true'
          EMCORE_C7_ACCEPTED: 'true'
          EMCORE_G9_ACCEPTED: 'true'
          EMCORE_WAVE1_ACCEPTED: 'true'
          EMCORE_WAVE2_ACCEPTED: 'true'
          EMCORE_ZERO_COST_VERIFIED: 'true'
        run: npm run check:release-predeploy

      - name: Deploy exact accepted release to existing PILOT Worker
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMCORE_PILOT_COST_MODE: zero
          WORKERS_CI_COMMIT_SHA: f57337c622d533a0200e51fcdf798deae5130754
        run: |
          set +x
          npm run deploy:cloudflare:pilot -- apps/web/wrangler.pilot.jsonc

      - name: Verify provider deployment state read-only
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          output="$(npm exec --workspace @emcore/web -- wrangler deployments status --name emcore-web-pilot --json)"
          test -n "$output" || { echo "No deployment state returned; fail closed."; exit 1; }
          printf '%s' "$output" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              JSON.parse(s);
              process.stdout.write("Provider deployment state is readable after deploy.\n");
            });
          '

      - name: Verify exact live runtime config
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        run: |
          node <<'NODE'
          const url = 'https://emcore-web-pilot.emcore-project.workers.dev/api/runtime-config';
          const expected = {
            supabaseUrl: 'https://qogvvvqqkipmstajvhzl.supabase.co',
            authMode: 'magic_link_mfa',
            documentIngestionEnabled: false,
            allowedOrganizationId: '00605bb8-3899-406e-a428-d7779e856bb2',
          };
          const response = await fetch(url, { headers: { accept: 'application/json' } });
          if (!response.ok) throw new Error(`runtime-config HTTP ${response.status}`);
          const body = await response.json();
          for (const [key, value] of Object.entries(expected)) {
            if (body[key] !== value) throw new Error(`runtime-config mismatch for ${key}`);
          }
          console.log('Live runtime configuration safety boundary verified.');
          NODE

      - name: Verify exact live deployment identity
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        run: |
          node <<'NODE'
          const response = await fetch('https://emcore-web-pilot.emcore-project.workers.dev/api/deployment-identity', {
            headers: { accept: 'application/json' },
          });
          if (!response.ok) throw new Error(`deployment-identity HTTP ${response.status}`);
          const body = await response.json();
          if (body.commitSha !== 'f57337c622d533a0200e51fcdf798deae5130754') {
            throw new Error('live deployment identity mismatch');
          }
          console.log('Live deployment identity matches exact accepted release SHA.');
          NODE

      - name: Run canonical public PILOT smoke
        if: steps.request.outputs.mode == 'DEPLOY'
        working-directory: source
        shell: bash
        env:
          EMCORE_PILOT_BASE_URL: https://emcore-web-pilot.emcore-project.workers.dev
          EMCORE_PILOT_ORGANIZATION_ID: 00605bb8-3899-406e-a428-d7779e856bb2
          EMCORE_PILOT_EXPECTED_COMMIT: f57337c622d533a0200e51fcdf798deae5130754
        run: npm run test:pilot:live

      - name: Record authenticated AAL2 automation boundary
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        run: |
          echo "Authenticated AAL2 smoke was not supplied an existing automated AAL2 credential in this release channel."
          echo "No user authentication or manual testing is requested. Public safety smoke remains authoritative for this Q2 run."

      - name: Q2 governed release complete
        if: steps.request.outputs.mode == 'DEPLOY'
        shell: bash
        run: |
          echo "Q2 PASS: exact accepted release deployed to emcore-web-pilot and public release acceptance passed."
          echo "Ingestion remained OFF. No Supabase/customer-data mutation was performed by this workflow."
