name: EMCORE CC35 Commercial Operating Cockpit Typecheck Correction Qualification

on:
  push:
    branches: [main]
    paths:
      - cc35-commercial-operating-cockpit-typecheck-correction-request.json

permissions:
  contents: read

concurrency:
  group: emcore-cc35-commercial-operating-cockpit-typecheck-correction
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./cc35-commercial-operating-cockpit-typecheck-correction-request.json');
          const expected = {
            schema: 'emcore.cc35-commercial-operating-cockpit-typecheck-correction.v1',
            mode: 'QUALIFY',
            mission: 'CC35-W4-COMMERCIAL-OPERATING-COCKPIT-TYPECHECK-CORRECTION-001',
            source_repository: 'emcore-project/emcore',
            source_commit: 'fb74de87aecdb480c64baa7e83e3c7b01b5406e6',
            source_tree: 'd0b8f23d173c6520e35ec416444001e678345d68',
            source_baseline: '7032662079be0be02d3ab78aa535aa3c3cfde85a',
            source_previous_head: 'a988f2488cf479857ecbedb8c2975920cd03f6fd',
            source_pr: 1092,
            expected_open_pr_count: 1,
            live_db_authorized: false,
            deployment_authorized: false,
            customer_data_authorized: false,
            onboarding_authorized: false,
            ingestion_enablement_authorized: false,
            outreach_authorized: false,
            payment_provider_authorized: false,
            partner_remuneration_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('CC35 correction request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: fb74de87aecdb480c64baa7e83e3c7b01b5406e6
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "fb74de87aecdb480c64baa7e83e3c7b01b5406e6"
          test "$(git rev-parse 'HEAD^{tree}')" = "d0b8f23d173c6520e35ec416444001e678345d68"
          git cat-file -e 7032662079be0be02d3ab78aa535aa3c3cfde85a^{commit}
          git cat-file -e a988f2488cf479857ecbedb8c2975920cd03f6fd^{commit}
          correction_changed="$(git diff --name-only a988f2488cf479857ecbedb8c2975920cd03f6fd..HEAD)"
          echo "$correction_changed"
          test "$correction_changed" = "packages/domain/src/commercial-operating-read-model.ts"
          changed="$(git diff --name-only 7032662079be0be02d3ab78aa535aa3c3cfde85a..HEAD)"
          echo "$changed"
          test "$(echo "$changed" | wc -l | tr -d ' ')" = "6"
          unexpected="$(echo "$changed" | grep -Ev '^(apps/web/src/CommercialOperatingCockpitDevSurface\.tsx|apps/web/src/commercial-operating-cockpit\.css|apps/web/src/main\.tsx|packages/domain/src/commercial-operating-read-model\.ts|scripts/browser-acceptance\.mjs|tests/commercial-operating-cockpit\.test\.ts)$' || true)"
          test -z "$unexpected"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1092||p[0].head.sha!=="fb74de87aecdb480c64baa7e83e3c7b01b5406e6"||p[0].base.sha!=="7032662079be0be02d3ab78aa535aa3c3cfde85a")process.exit(2);})'
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused cockpit qualification
        working-directory: source
        run: node --experimental-strip-types --test tests/commercial-operating-cockpit.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: Assert cockpit safety boundaries
        working-directory: source
        shell: bash
        run: |
          correction_changed="$(git diff --name-only a988f2488cf479857ecbedb8c2975920cd03f6fd..HEAD)"
          test "$correction_changed" = "packages/domain/src/commercial-operating-read-model.ts"
          changed="$(git diff --name-only 7032662079be0be02d3ab78aa535aa3c3cfde85a..HEAD)"
          test "$(echo "$changed" | grep '^supabase/migrations/' | wc -l | tr -d ' ')" = "0"
          ! echo "$changed" | grep -E 'CustomerPortal|AccountPage'
          ! git diff 7032662079be0be02d3ab78aa535aa3c3cfde85a..HEAD | grep -Ei 'create policy|grant .* to authenticated|grant .* to anon|organization_memberships|persist_commercial_control_plane_snapshot_v1'
          ! git diff 7032662079be0be02d3ab78aa535aa3c3cfde85a..HEAD | grep -Ei 'stripe|payment_provider|wrangler|cloudflare|customer onboarding|DOCUMENT_INGESTION_ENABLED *= *true'
          grep -q 'onboardingAuthorized.*false' packages/domain/src/commercial-operating-read-model.ts
          grep -q 'satisfies CommercialAccountOperatingSnapshotV1' packages/domain/src/commercial-operating-read-model.ts
          echo "CC35_COMMERCIAL_OPERATING_COCKPIT_TYPECHECK_CORRECTION_QUALIFICATION=PASS"
          echo "LIVE_DB_MUTATION=NONE"
          echo "DEPLOYMENT_MUTATION=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "ONBOARDING=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "RLS_BROADENING=NONE"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
