name: CC39 Source Checkout Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc39-source-checkout-probe.yml'

permissions:
  contents: read

jobs:
  source-checkout-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact EMCORE head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 0e9455d1e524a3f6dce1618a44980417c5277b42
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact head
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "0e9455d1e524a3f6dce1618a44980417c5277b42"
          echo "CC39_SOURCE_CHECKOUT_PROBE_PASS"
