name: CC42 D02 Type Contract Correction Qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc42-d02-type-contract-correction.yml'

permissions:
  contents: read

concurrency:
  group: emcore-cc42-d02-type-contract-correction
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrected EMCORE head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: ccc68192c8774be5fdafba50b2ca8d83b182fc86
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact identity and 18-file boundary
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ccc68192c8774be5fdafba50b2ca8d83b182fc86"
          echo "PR_HEAD_TREE=$(git rev-parse 'HEAD^{tree}')"
          git cat-file -e ca224673f3a94227a85ba1303a420a18b726673a^{commit}
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const expected = [
            'apps/web/src/SupplyTechnicalDossier.tsx',
            'apps/web/worker/r4e-live-proof.ts',
            'packages/domain/src/gas-rcu-commercial-capacity-semantics.ts',
            'packages/domain/src/gas-rcu-commercial-settlement-semantics.ts',
            'packages/domain/src/gas-rcu-fields.ts',
            'packages/domain/src/supply-profile-facts.ts',
            'packages/domain/src/supply-technical-profile.ts',
            'packages/server/src/supabase-sii-check-pod-supply-profile-persistence.ts',
            'packages/server/src/supabase-sii-rcu-gas-supply-profile-persistence.ts',
            'packages/server/src/supabase-supply-profile-context.ts',
            'scripts/dev-technical-dossier-smoke.mjs',
            'supabase/migrations/20260922103000_d02_energy_manager_completeness.sql',
            'tests/d02-energy-manager-completeness.test.ts',
            'tests/gas-rcu-commercial-capacity-semantics.test.ts',
            'tests/gas-rcu-commercial-settlement-semantics.test.ts',
            'tests/gas-rcu-fields.test.ts',
            'tests/sii-check-pod-d02.test.ts',
            'tests/supply-profile-facts.test.ts'
          ].sort();
          const out = execFileSync('git',['diff','--name-only','ca224673f3a94227a85ba1303a420a18b726673a..HEAD'],{encoding:'utf8'}).trim();
          const actual = out ? out.split('\n').filter(Boolean).sort() : [];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('18-file boundary mismatch: '+JSON.stringify(actual));
          console.log('SOURCE_SCOPE_BOUNDARY=PASS');
          NODE
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1094||p[0].head.sha!=="ccc68192c8774be5fdafba50b2ca8d83b182fc86"||p[0].base.sha!=="ca224673f3a94227a85ba1303a420a18b726673a")process.exit(2);console.log("OPEN_PR_IDENTITY=PASS")})'

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused web type check
        working-directory: source
        run: npm run check --workspace @emcore/web

      - name: Full canonical type check
        working-directory: source
        run: npm run check

      - name: Focused D02 authority and context tests
        working-directory: source
        run: |
          node --experimental-strip-types --test             tests/d02-energy-manager-completeness.test.ts             tests/supply-profile-facts.test.ts             tests/sii-check-pod-d02.test.ts             tests/gas-rcu-fields.test.ts             tests/gas-rcu-commercial-capacity-semantics.test.ts             tests/gas-rcu-commercial-settlement-semantics.test.ts

      - name: Verify exact correction contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function parseField(value: unknown): SupplyProfileContextFieldWithAuthority" packages/server/src/supabase-supply-profile-context.ts
          grep -q "authorityClass: 'DEV_SYNTHETIC' as const" apps/web/worker/r4e-live-proof.ts
          echo "TS2322_CORRECTION_CONTRACT=PASS"
          echo "NO_SEMANTIC_WIDENING_BY_CORRECTION=PASS"
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
