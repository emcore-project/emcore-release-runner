name: EMCORE Q26 D06 Fundamental Driver Signal Bundle Qualification

on:
  push:
    branches: [main]
    paths:
      - q26-d06-fundamental-driver-signal-bundle-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q26-d06-fundamental-driver-signal-bundle
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q26-d06-fundamental-driver-signal-bundle-request.json');
          const expected = {
            schema: 'emcore.q26-d06-fundamental-driver-signal-bundle.v1',
            mode: 'QUALIFY',
            mission: 'CC26-D06-GOVERNED-FUNDAMENTAL-DRIVER-SIGNAL-BUNDLE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '9b209f5427bd8f7b70f33ef7deb1554c6c152090',
            source_baseline: '373676a16fd2a6c9c04d1d1c93b36a47d8374b1b',
            live_open_source_access_authorized: false,
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            customer_data_authorized: false,
            customer_ingestion_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            market_benchmark_ingestion_authorized: false,
            price_fair_value_engine_authorized: false,
            final_scenario_auto_execution_authorized: false,
            fixing_execution_authorized: false,
            trading_execution_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) if (r[key] !== value) throw new Error('Q26 request mismatch: ' + key);
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 9b209f5427bd8f7b70f33ef7deb1554c6c152090
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "9b209f5427bd8f7b70f33ef7deb1554c6c152090"
          test -z "$(git status --porcelain)"
          git cat-file -e 373676a16fd2a6c9c04d1d1c93b36a47d8374b1b^{commit}
          changed="$(git diff --name-only 373676a16fd2a6c9c04d1d1c93b36a47d8374b1b..HEAD)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/fundamental-scenario-engine\.ts|packages/server/src/governed-fundamental-driver-signal-bundle\.ts|apps/web/src/FundamentalDriverSignalBundleDevPanel\.tsx|apps/web/src/MarketOpportunitiesDevSurface\.tsx|tests/governed-fundamental-driver-signal-bundle\.test\.ts)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D06 driver signal tests
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/governed-fundamental-driver-signal-bundle.test.ts \
            tests/governed-independent-fundamental-scenario-engine.test.ts \
            tests/governed-historical-open-fundamental-reference-bundle.test.ts \
            tests/governed-open-fundamental-reference-baselines.test.ts \
            tests/governed-live-open-fundamental-bundle.test.ts \
            tests/governed-fundamental-feature-pipeline.test.ts \
            tests/governed-fundamental-market-consistency-bridge.test.ts \
            tests/market-opportunities-dev-surface.test.ts \
            tests/portal-navigation.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert driver bundle safety rights isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          ! grep -RE "setInterval\(" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          ! grep -RE "EEX_FORWARD|GME_FORWARD|ICE_FORWARD|MONTEL_LICENSED|fairValue|priceForecast:" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "runtimeAutomaticFetching: false" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "finalScenarioAutoExecution: false" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "buildFundamentalDriverSignal" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "buildFundamentalScenario" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "nuclear-unavailable-relative.v1" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "gas-production-relative.v1" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "temperature-heating-delta.v1" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          grep -q "EXPLICIT_WINTER_HEATING_REQUIRED" packages/server/src/governed-fundamental-driver-signal-bundle.ts
          echo "DRIVER_SIGNAL_BUNDLE=PASS"
          echo "POWER_GAS_PARITY=PASS"
          echo "DEPENDENCY_GROUPS=PRESERVED"
          echo "NO_SILENT_INTERPOLATION=PASS"
          echo "AUTOMATIC_RUNTIME_FETCHING=OFF"
          echo "FINAL_SCENARIO_AUTO_EXECUTION=OFF"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "CUSTOMER_INGESTION=NONE"
          echo "PRICE_FAIR_VALUE_ENGINE=NONE"
          echo "FIXING_EXECUTION=NONE"
          echo "TRADING_EXECUTION=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q26_D06_FUNDAMENTAL_DRIVER_SIGNAL_BUNDLE=PASS"
