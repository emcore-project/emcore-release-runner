name: P2 Inizio Documenti Exact-Head Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p2-inizio-documenti-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Harness boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" = "main"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          test "$changed" = ".github/workflows/p2-inizio-documenti-qualification.yml"
          ! grep -Eiq "wrangler deploy|supabase db push|service_role|Q29_BYPASS.*true" .github/workflows/p2-inizio-documenti-qualification.yml
          echo "HARNESS_BOUNDARY=PASS"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: c849a4e206690e73ecbd848fec5690b45f166104
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and bounded diff
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c849a4e206690e73ecbd848fec5690b45f166104"
          test "$(git rev-parse 'HEAD^{tree}')" = "1d610c128eb6e719744d39c952d665fcbc652dc0"
          changed="$(git diff --name-only b3b993e3a81aaf0235b2477932584a987bd1340b..HEAD)"
          expected="$(printf '%s\n' 'apps/web/src/ProductPreviewV02App.tsx' 'apps/web/src/product-preview-v02.css')"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_SOURCE_AND_DIFF=PASS"
          echo "AUTHORIZED_FILES_ONLY=PASS"

      - name: Verify immutable governed files
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for f in             apps/web/src/FornitureV04Cleanroom.tsx             apps/web/src/forniture-v04-cleanroom.css             apps/web/src/product-preview-visual-v13.css             apps/web/src/portal-navigation.ts             apps/web/src/product-preview-data.ts             apps/web/src/portal-data-source.ts             apps/web/src/workspace-source.ts             apps/web/src/product-preview-technical-facts.ts
          do
            git diff --quiet b3b993e3a81aaf0235b2477932584a987bd1340b..HEAD -- "$f"
          done
          echo "FORNITURE_FOUNDATION_GOVERNED_FILES_IMMUTABLE=PASS"

      - name: Verify TSX isolation only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/ProductPreviewV02App.tsx"
          test "$(git diff --numstat b3b993e3a81aaf0235b2477932584a987bd1340b..HEAD -- "$f")" = $'2\t2\tapps/web/src/ProductPreviewV02App.tsx'
          grep -q 'emcore-v02__stack emcore-v02__page--home' "$f"
          grep -q 'emcore-v02__stack emcore-v02__page--documents' "$f"
          test "$(grep -c 'emcore-v02__page--home' "$f")" -eq 1
          test "$(grep -c 'emcore-v02__page--documents' "$f")" -eq 1
          git show b3b993e3a81aaf0235b2477932584a987bd1340b:"$f" > /tmp/before.tsx
          sed 's/ emcore-v02__page--home//; s/ emcore-v02__page--documents//' "$f" > /tmp/after-normalized.tsx
          cmp -s /tmp/before.tsx /tmp/after-normalized.tsx
          echo "TARGET_WRAPPER_ISOLATION=PASS"
          echo "TARGET_BODY_LOGIC_COPY_UNCHANGED=PASS"

      - name: Verify P2 CSS scope
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/product-preview-v02.css"
          grep -q 'P2 INIZIO + DOCUMENTI' "$f"
          grep -q '.emcore-v02__page--home .emcore-v02__hero' "$f"
          grep -q '.emcore-v02__page--documents .emcore-v02__toolbar' "$f"
          grep -q '.emcore-v02__page--documents .emcore-v02__row.is-selected' "$f"
          awk '
            /P2 INIZIO \+ DOCUMENTI/{flag=1}
            flag && /^[[:space:]]*\.emcore-v02__/ && $0 !~ /page--home|page--documents/ {
              print "UNSCOPED_P2_SELECTOR: " $0
              bad=1
            }
            END { exit bad }
          ' "$f"
          tail_section="$(sed -n '/P2 INIZIO + DOCUMENTI/,$p' "$f")"
          printf '%s' "$tail_section" | grep -q -- 'var(--emcore-v13-card-border)'
          printf '%s' "$tail_section" | grep -q -- 'var(--emcore-v13-structural-header-start)'
          printf '%s' "$tail_section" | grep -q -- 'var(--emcore-v13-row-selected-start)'
          printf '%s' "$tail_section" | grep -q -- 'var(--emcore-v13-focus-color)'
          echo "P2_SCOPED_CSS=PASS"
          echo "V13_BODY_LANGUAGE_CONSUMPTION=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Verify P2 present in runtime bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist
          grep -R -q -- ".emcore-v02__page--home" apps/web/dist
          grep -R -q -- ".emcore-v02__page--documents" apps/web/dist
          grep -R -q -- "--emcore-v13-row-selected-start" apps/web/dist
          echo "P2_PRESENT_IN_RUNTIME_BUNDLE=PASS"

      - name: Governed safety boundary
        shell: bash
        run: |
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_OUT_OF_SCOPE_PAGE_PROPAGATION=PASS"
          echo "NO_FORNITURE_REWIRE=PASS"
          echo "NO_DOMAIN_DATA_AUTH_RLS_SCHEMA_MUTATION=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "P2_INIZIO_DOCUMENTI=QUALIFICATION_PASS"
