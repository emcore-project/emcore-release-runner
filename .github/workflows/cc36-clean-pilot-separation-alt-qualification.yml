name: EMCORE CC36 Clean PILOT Separation Alt Qualification

on:
  push:
    branches: [main]
    paths:
      - cc36-clean-pilot-separation-alt-qualification-request.json

permissions:
  contents: read

concurrency:
  group: emcore-cc36-clean-pilot-separation-alt-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./cc36-clean-pilot-separation-alt-qualification-request.json');
          const expected = {
            schema: 'emcore.cc36-clean-pilot-separation-alt-qualification.v1',
            mode: 'QUALIFY',
            mission: 'CC36-W4-CLEAN-PILOT-CUSTOMER-PORTAL-SEPARATION-ALT-QUALIFICATION-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '2235729e7549d9c880a3612c0372730fd3a8b664',
            source_tree: '6014f014a762df7f49594af8dbe6e52d0d4ff133',
            source_baseline: '20f4e1fdc847997144af8864d15c6410fba5f48f',
            source_pr: 1093,
            expected_open_pr_count: 1,
            live_db_authorized: false,
            deployment_authorized: false,
            customer_data_authorized: false,
            onboarding_authorized: false,
            ingestion_enablement_authorized: false,
            outreach_authorized: false,
            payment_provider_authorized: false,
            partner_remuneration_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('CC36 qualification request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 2235729e7549d9c880a3612c0372730fd3a8b664
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "2235729e7549d9c880a3612c0372730fd3a8b664"
          test "$(git rev-parse 'HEAD^{tree}')" = "6014f014a762df7f49594af8dbe6e52d0d4ff133"
          git cat-file -e 20f4e1fdc847997144af8864d15c6410fba5f48f^{commit}
          changed="$(git diff --name-only 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "15"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(apps/web/src/DevExperienceShell\.tsx|apps/web/src/main\.tsx|apps/web/src/supabase-browser\.ts|apps/web/worker/runtime\.ts|apps/web/wrangler\.jsonc|apps/web/wrangler\.pilot\.example\.jsonc|apps/web/wrangler\.pilot\.jsonc|scripts/browser-acceptance\.mjs|scripts/pilot-readiness-check\.mjs|scripts/v1-release-hardening-check\.mjs|tests/application-surface-routing\.test\.ts|tests/commercial-operating-cockpit\.test\.ts|tests/supabase-browser-runtime-config\.test\.ts|tests/supabase-browser-runtime\.test\.ts|tests/worker-runtime\.test\.ts)$' || true)"
          test -z "$unexpected"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1093||p[0].head.sha!=="2235729e7549d9c880a3612c0372730fd3a8b664"||p[0].base.sha!=="20f4e1fdc847997144af8864d15c6410fba5f48f")process.exit(2);})'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused clean PILOT separation qualification
        working-directory: source
        run: node --experimental-strip-types --test tests/application-surface-routing.test.ts tests/supabase-browser-runtime-config.test.ts tests/supabase-browser-runtime.test.ts tests/worker-runtime.test.ts tests/commercial-operating-cockpit.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: Assert separation safety boundaries
        working-directory: source
        shell: bash
        run: |
          changed="$(git diff --name-only 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD)"
          test "$(printf '%s\n' "$changed" | grep '^supabase/migrations/' | wc -l | tr -d ' ')" = "0"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(CustomerPortal|AccountPage)\.tsx$'
          ! git diff 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD | grep -Ei 'create policy|grant .* to authenticated|grant .* to anon|organization_memberships'
          ! git diff 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD | grep -Ei 'stripe|payment_provider|customer onboarding|DOCUMENT_INGESTION_ENABLED *= *true'
          grep -q 'APPLICATION_SURFACE_MODE' apps/web/worker/runtime.ts
          grep -q 'applicationSurfaceMode' apps/web/src/supabase-browser.ts
          grep -q 'DevExperienceShell' apps/web/src/main.tsx
          echo "CC36_CLEAN_PILOT_SEPARATION_ALT_QUALIFICATION=PASS"
          echo "LIVE_DB_MUTATION=NONE"
          echo "DEPLOYMENT_MUTATION=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "ONBOARDING=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "RLS_BROADENING=NONE"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
