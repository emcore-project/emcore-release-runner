name: EMCORE Q21 D06 Fundamental Market Consistency Bridge Qualification

on:
  push:
    branches: [main]
    paths:
      - q21-d06-fundamental-market-consistency-bridge-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q21-d06-fundamental-market-consistency-bridge
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q21-d06-fundamental-market-consistency-bridge-request.json');
          const expected = {
            schema: 'emcore.q21-d06-fundamental-market-consistency-bridge.v1',
            mode: 'QUALIFY',
            mission: 'CC25-D06-GOVERNED-FUNDAMENTAL-MARKET-CONSISTENCY-BRIDGE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: 'fd71c683e828b5df8855f194672a32f503dd911f',
            source_tree: '6ee8f513ce22f6614991463ffa06a6d6dc6c7419',
            source_baseline: 'b27cbc72ff9560f86c96be4e960ac0c89f64ca4f',
            live_open_source_access_authorized: false,
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            customer_data_authorized: false,
            customer_ingestion_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            market_benchmark_ingestion_authorized: false,
            restricted_training_calibration_authorized: false,
            price_fair_value_engine_authorized: false,
            fixing_execution_authorized: false,
            trading_execution_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q21 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: fd71c683e828b5df8855f194672a32f503dd911f
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "fd71c683e828b5df8855f194672a32f503dd911f"
          test "$(git rev-parse 'HEAD^{tree}')" = "6ee8f513ce22f6614991463ffa06a6d6dc6c7419"
          test -z "$(git status --porcelain)"
          git cat-file -e b27cbc72ff9560f86c96be4e960ac0c89f64ca4f^{commit}
          changed="$(git diff --name-only b27cbc72ff9560f86c96be4e960ac0c89f64ca4f..HEAD)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -E '^(\.github/workflows/|supabase/|package\.json$|package-lock\.json$|apps/web/wrangler|scripts/cloudflare|scripts/pilot-live)'; then
            echo "Forbidden deployment/dependency/provider scope change" >&2
            exit 1
          fi
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/fundamental-market-consistency\.ts|apps/web/src/FundamentalMarketConsistencyDevPanel\.tsx|apps/web/src/MarketOpportunitiesDevSurface\.tsx|tests/governed-fundamental-market-consistency-bridge\.test\.ts)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused consistency bridge tests
        working-directory: source
        run: |
          node --experimental-strip-types --test             tests/governed-fundamental-market-consistency-bridge.test.ts             tests/governed-independent-fundamental-scenario-engine.test.ts             tests/forward-scenario-engine.test.ts             tests/governed-market-snapshot-intake.test.ts             tests/governed-gas-commercial-structure-parity.test.ts             tests/market-opportunities-dev-surface.test.ts             tests/portal-navigation.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert authority separation runtime isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          ! grep -RE "fetch\(|axios|setInterval|setTimeout"             packages/domain/src/fundamental-market-consistency.ts             apps/web/src/FundamentalMarketConsistencyDevPanel.tsx
          node --experimental-strip-types --input-type=module <<'NODE'
          import { ECMWF_PRODUCT_CONTRACT } from './packages/server/src/ecmwf-open-data-adapter.ts';
          import { SOURCE_INTELLIGENCE_DATASETS } from './packages/domain/src/source-intelligence.ts';
          if (ECMWF_PRODUCT_CONTRACT.automaticRuntimeFetching !== false) throw new Error('automatic runtime fetching changed');
          for (const key of ['EEX_FORWARD_LICENSED_SLOT','GME_FORWARD_LICENSED_SLOT','ICE_FORWARD_LICENSED_SLOT','MONTEL_LICENSED_SLOT']) {
            if (SOURCE_INTELLIGENCE_DATASETS[key].activationState !== 'OFF') throw new Error(key + ' unexpectedly active');
          }
          console.log('AUTOMATIC_RUNTIME_FETCHING=OFF');
          console.log('LICENSED_MARKET_SLOTS=OFF');
          console.log('FUNDAMENTAL_MARKET_AUTHORITY_SEPARATION=PASS');
          console.log('PRICE_FAIR_VALUE_ENGINE=NONE');
          console.log('FIXING_EXECUTION=NONE');
          console.log('TRADING_EXECUTION=NONE');
          NODE
          echo "LIVE_OPEN_SOURCE_ACCESS=NONE"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "MARKET_BENCHMARK_INGESTION=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "CUSTOMER_INGESTION=NONE"
          echo "DEPLOYMENT=NONE"
          echo "RESTRICTED_TRAINING_CALIBRATION=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q21_D06_FUNDAMENTAL_MARKET_CONSISTENCY_BRIDGE=PASS"
