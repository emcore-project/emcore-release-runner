name: EMCORE Q36 D13 Postmerge Identity

on:
  push:
    branches: [main]
    paths:
      - q36-d13-postmerge-identity-request.json

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate postmerge request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q36-d13-postmerge-identity-request.json');
          const expected = {
            schema: 'emcore.q36-d13-postmerge-identity.v1',
            mode: 'VERIFY_POSTMERGE_IDENTITY',
            mission: 'CC30-D13-GOVERNED-PAYMENT-GUARANTEE-WORKING-CAPITAL-ENGINE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: 'b50de2c6ae2dcb2c0cfcfbc709f6d4a296cd03d0',
            expected_tree: '01f8591a9c109174f572fbb41101c95a8d0c530e',
            deployment_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q36 postmerge request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact merged main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: b50de2c6ae2dcb2c0cfcfbc709f6d4a296cd03d0
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify postmerge identity
        working-directory: source
        shell: bash
        run: |
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$head" = "b50de2c6ae2dcb2c0cfcfbc709f6d4a296cd03d0"
          test "$tree" = "01f8591a9c109174f572fbb41101c95a8d0c530e"
          test -z "$(git status --porcelain)"
          echo "POSTMERGE_HEAD=$head"
          echo "POSTMERGE_TREE=$tree"
          echo "QUALIFIED_TREE=01f8591a9c109174f572fbb41101c95a8d0c530e"
          echo "POSTMERGE_IDENTITY=PASS"
          echo "DEPLOYMENT_MUTATION=NONE"
          echo "Q29_READINESS_BYPASS=NONE"
