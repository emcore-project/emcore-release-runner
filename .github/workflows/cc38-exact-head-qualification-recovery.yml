name: EMCORE CC38 Exact-Head Qualification Recovery

on:
  push:
    branches: [main]
    paths:
      - cc38-exact-head-qualification-request.json

permissions:
  contents: read

concurrency:
  group: emcore-cc38-exact-head-qualification-recovery
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./cc38-exact-head-qualification-request.json');
          const expected = {
            schema: 'emcore.cc38.exact-head-qualification.v1',
            mode: 'QUALIFY',
            mission: 'CC38-W4-CLEAN-PILOT-CUSTOMER-PORTAL-SEPARATION-EXACT-HEAD-QUALIFICATION-RECOVERY-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '0e9455d1e524a3f6dce1618a44980417c5277b42',
            source_tree: '59878c742bdb5656a862a7c9b973f8e011928f49',
            source_baseline: '20f4e1fdc847997144af8864d15c6410fba5f48f',
            previous_head: '2235729e7549d9c880a3612c0372730fd3a8b664',
            source_pr: 1093,
            expected_open_pr_count: 1,
            live_db_authorized: false,
            deployment_authorized: false,
            customer_data_authorized: false,
            onboarding_authorized: false,
            ingestion_enablement_authorized: false,
            outreach_authorized: false,
            payment_provider_authorized: false,
            partner_remuneration_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('CC38 qualification request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 0e9455d1e524a3f6dce1618a44980417c5277b42
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "0e9455d1e524a3f6dce1618a44980417c5277b42"
          test "$(git rev-parse 'HEAD^{tree}')" = "59878c742bdb5656a862a7c9b973f8e011928f49"
          git cat-file -e 20f4e1fdc847997144af8864d15c6410fba5f48f^{commit}
          git cat-file -e 2235729e7549d9c880a3612c0372730fd3a8b664^{commit}
          changed="$(git diff --name-only 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD)"
          printf '%s
' "$changed"
          test "$(printf '%s
' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')" = "23"
          unexpected="$(printf '%s
' "$changed" | grep -Ev '^(apps/web/src/DevExperienceShell\.tsx|apps/web/src/main\.tsx|apps/web/src/supabase-browser\.ts|apps/web/worker/runtime\.ts|apps/web/wrangler\.jsonc|apps/web/wrangler\.pilot\.example\.jsonc|apps/web/wrangler\.pilot\.jsonc|scripts/browser-acceptance\.mjs|scripts/pilot-readiness-check\.mjs|scripts/v1-release-hardening-check\.mjs|tests/account-menu-wiring-source\.test\.ts|tests/application-surface-routing\.test\.ts|tests/commercial-operating-cockpit\.test\.ts|tests/decision-assessment-framework-source\.test\.ts|tests/dev-organization-boundary\.test\.ts|tests/dev-showcase-surface-static\.test\.ts|tests/document-evidence-focus-source\.test\.ts|tests/document-ingestion-boundary\.test\.ts|tests/ingestion-freeze-ui-source\.test\.ts|tests/pilot-auth-gate-source\.test\.ts|tests/supabase-browser-runtime-config\.test\.ts|tests/supabase-browser-runtime\.test\.ts|tests/worker-runtime\.test\.ts)$' || true)"
          test -z "$unexpected"
          correction="$(git diff --name-only 2235729e7549d9c880a3612c0372730fd3a8b664..HEAD)"
          test "$(printf '%s
' "$correction" | sed '/^$/d' | wc -l | tr -d ' ')" = "8"
          correction_unexpected="$(printf '%s
' "$correction" | grep -Ev '^(tests/account-menu-wiring-source\.test\.ts|tests/decision-assessment-framework-source\.test\.ts|tests/dev-organization-boundary\.test\.ts|tests/dev-showcase-surface-static\.test\.ts|tests/document-evidence-focus-source\.test\.ts|tests/document-ingestion-boundary\.test\.ts|tests/ingestion-freeze-ui-source\.test\.ts|tests/pilot-auth-gate-source\.test\.ts)$' || true)"
          test -z "$correction_unexpected"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1093||p[0].head.sha!=="0e9455d1e524a3f6dce1618a44980417c5277b42"||p[0].base.sha!=="20f4e1fdc847997144af8864d15c6410fba5f48f")process.exit(2);})'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused application-surface/runtime qualification
        working-directory: source
        run: node --experimental-strip-types --test tests/application-surface-routing.test.ts tests/supabase-browser-runtime-config.test.ts tests/supabase-browser-runtime.test.ts tests/worker-runtime.test.ts tests/commercial-operating-cockpit.test.ts tests/account-menu-wiring-source.test.ts tests/decision-assessment-framework-source.test.ts tests/dev-organization-boundary.test.ts tests/dev-showcase-surface-static.test.ts tests/document-evidence-focus-source.test.ts tests/document-ingestion-boundary.test.ts tests/ingestion-freeze-ui-source.test.ts tests/pilot-auth-gate-source.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: Assert separation safety boundaries
        working-directory: source
        shell: bash
        run: |
          changed="$(git diff --name-only 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD)"
          test "$(printf '%s
' "$changed" | grep '^supabase/migrations/' | wc -l | tr -d ' ')" = "0"
          ! printf '%s
' "$changed" | grep -E '(^|/)(CustomerPortal|AccountPage)\.tsx$'
          ! git diff 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD | grep -Ei 'create policy|grant .* to authenticated|grant .* to anon|organization_memberships'
          ! git diff 20f4e1fdc847997144af8864d15c6410fba5f48f..HEAD | grep -Ei 'stripe|payment_provider|customer onboarding|DOCUMENT_INGESTION_ENABLED *= *true'
          grep -q 'APPLICATION_SURFACE_MODE' apps/web/worker/runtime.ts
          grep -q 'applicationSurfaceMode' apps/web/src/supabase-browser.ts
          grep -q "applicationSurfaceMode === 'PILOT'" apps/web/src/main.tsx
          grep -q "applicationSurfaceMode === 'DEV'" apps/web/src/main.tsx
          grep -q 'DevExperienceShell' apps/web/src/main.tsx
          grep -q '"APPLICATION_SURFACE_MODE": "pilot"' apps/web/wrangler.pilot.jsonc
          grep -q '"DOCUMENT_INGESTION_ENABLED": "false"' apps/web/wrangler.pilot.jsonc
          echo "CC38_EXACT_HEAD_QUALIFICATION=PASS"
          echo "LIVE_DB_MUTATION=NONE"
          echo "DEPLOYMENT_MUTATION=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "ONBOARDING=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "RLS_BROADENING=NONE"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
