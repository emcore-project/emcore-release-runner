name: P0 Shared Visual Foundation Exact-Head Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p0-shared-visual-foundation-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" = "main"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          test "$changed" = ".github/workflows/p0-shared-visual-foundation-qualification.yml"
          ! grep -Eiq "deployment|wrangler deploy|supabase db push|service_role|Q29_BYPASS.*true" .github/workflows/p0-shared-visual-foundation-qualification.yml
          echo "HARNESS_BOUNDARY=PASS"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: cde6303d68ea91e9e971cf71dda17ccc05f29389
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and bounded diff
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cde6303d68ea91e9e971cf71dda17ccc05f29389"
          test "$(git rev-parse 'HEAD^{tree}')" = "21be54ffa5c5acb11e66a9763bb462f90c6da9fa"
          test "$(git rev-parse HEAD^)" = "a9262889d1880bc4a626a86284e4606982bf30f5"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = "apps/web/src/product-preview-visual-v13.css"
          test -z "$(git status --porcelain)"
          echo "EXACT_SOURCE_AND_DIFF=PASS"

      - name: Verify foundation contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/product-preview-visual-v13.css"
          test -f "$f"
          grep -q -- "--emcore-v13-shell-sidebar:" "$f"
          grep -q -- "--emcore-v13-structural-header-start:" "$f"
          grep -q -- "--emcore-v13-row-selected-start:" "$f"
          grep -q -- "--emcore-v13-control-inactive-bg:" "$f"
          grep -q -- "--emcore-v13-control-hover-bg:" "$f"
          grep -q -- "--emcore-v13-control-active-bg:" "$f"
          grep -q -- "--emcore-v13-status-ok-bg:" "$f"
          grep -q -- "--emcore-v13-status-attention-bg:" "$f"
          grep -q -- "--emcore-v13-status-critical-bg:" "$f"
          grep -q -- "--emcore-v13-status-neutral-bg:" "$f"
          grep -q -- "--emcore-v13-gas:" "$f"
          grep -q -- "--emcore-v13-electricity:" "$f"
          grep -q -- "--emcore-v13-focus-color:" "$f"
          grep -q -- "--emcore-v13-target-min:" "$f"
          ! grep -Eq "\.v04__|\.emcore-v02__" "$f"
          ! grep -Eq "(^|[[:space:]])(html|body|\*|button|input|a)[[:space:]]*\{" "$f"
          refs="$(grep -RIl --exclude='product-preview-visual-v13.css' --exclude-dir=node_modules 'product-preview-visual-v13.css' apps packages tests || true)"
          test -z "$refs"
          echo "FOUNDATION_CONTRACT=PASS"
          echo "UNCONSUMED_BY_CURRENT_PRODUCT=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: Verify approved Forniture files unchanged from V13 baseline
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet a9262889d1880bc4a626a86284e4606982bf30f5..HEAD -- apps/web/src/FornitureV04Cleanroom.tsx
          git diff --quiet a9262889d1880bc4a626a86284e4606982bf30f5..HEAD -- apps/web/src/forniture-v04-cleanroom.css
          git diff --quiet a9262889d1880bc4a626a86284e4606982bf30f5..HEAD -- apps/web/src/ProductPreviewV02App.tsx
          git diff --quiet a9262889d1880bc4a626a86284e4606982bf30f5..HEAD -- apps/web/src/product-preview-v02.css
          echo "CURRENT_PAGE_IMPLEMENTATIONS_UNCHANGED=PASS"

      - name: Governed safety boundary
        shell: bash
        run: |
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_PAGE_PROPAGATION=PASS"
          echo "NO_FORNITURE_REWIRE=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "P0_SHARED_VISUAL_FOUNDATION=TERMINAL_PASS"
