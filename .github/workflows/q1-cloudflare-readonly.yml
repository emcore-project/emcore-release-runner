name: EMCORE Q1 Cloudflare Read-Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - q1-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q1-cloudflare-readonly
  cancel-in-progress: false

jobs:
  qualify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate Q1 request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('q1-request.json', 'utf8'));
          const required = {
            schema: 'emcore.q1-request.v1',
            source_repository: 'emcore-project/emcore',
            source_commit: '0c775494c3ca669430874cc4e2605cd065899b44',
            source_tree: 'b8d59bc200e5e960050d0f154601d3c2034728e3',
            expected_open_pr_count: 0,
            target_worker: 'emcore-web-pilot',
            cloudflare_read_only: true,
            deployment_authorized: false,
          };
          for (const [key, value] of Object.entries(required)) {
            if (request[key] !== value) throw new Error(`q1-request mismatch for ${key}`);
          }
          if (!['IDLE', 'QUALIFY'].includes(request.mode)) {
            throw new Error('q1-request mode must be IDLE or QUALIFY');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${request.mode}\n`);
          NODE

      - name: Stop safely while IDLE
        if: steps.request.outputs.mode == 'IDLE'
        shell: bash
        run: echo "Q1 is prepared but not activated. No Cloudflare secret was read."

      - name: Require Q1 secrets
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$EMCORE_SOURCE_TOKEN" || { echo "EMCORE_SOURCE_TOKEN missing; fail closed."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing; fail closed."; exit 1; }

      - name: Checkout exact private EMCORE source
        if: steps.request.outputs.mode == 'QUALIFY'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 0c775494c3ca669430874cc4e2605cd065899b44
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "0c775494c3ca669430874cc4e2605cd065899b44" || { echo "Commit mismatch; fail closed."; exit 1; }
          test "$(git rev-parse 'HEAD^{tree}')" = "b8d59bc200e5e960050d0f154601d3c2034728e3" || { echo "Tree mismatch; fail closed."; exit 1; }
          echo "Exact source identity verified."

      - name: Verify zero open source pull requests
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          count="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')"
          test "$count" = "0" || { echo "Open pull requests detected; fail closed."; exit 1; }
          echo "Open pull request count verified at zero."

      - name: Set up Node
        if: steps.request.outputs.mode == 'QUALIFY'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact source dependencies
        if: steps.request.outputs.mode == 'QUALIFY'
        working-directory: source
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Read Cloudflare account cost state and fail closed
        if: steps.request.outputs.mode == 'QUALIFY'
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          whoami_json="$(npm exec --workspace @emcore/web -- wrangler whoami --json)" || {
            echo "Cloudflare account identity read failed; fail closed."
            exit 1
          }
          account_id="$(printf '%s' "$whoami_json" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const body=JSON.parse(s);
              const ids=[];
              const visit=(v,k="")=>{
                if (!v || typeof v!=="object") return;
                if (Array.isArray(v)) return v.forEach(x=>visit(x,k));
                for (const [key,val] of Object.entries(v)) {
                  if ((key==="account_id" || key==="accountId") && typeof val==="string") ids.push(val);
                  if (key==="accounts" && Array.isArray(val)) {
                    for (const a of val) if (a && typeof a.id==="string") ids.push(a.id);
                  }
                  visit(val,key);
                }
              };
              visit(body);
              const unique=[...new Set(ids.filter(x=>/^[A-Za-z0-9_-]{16,64}$/.test(x)))];
              if (unique.length!==1) process.exit(2);
              process.stdout.write(unique[0]);
            });
          ')" || {
            echo "Unable to resolve one Cloudflare account ID read-only; fail closed."
            exit 1
          }
          response="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json" "https://api.cloudflare.com/client/v4/accounts/$account_id/subscriptions")" || {
            echo "Cloudflare billing/subscription read failed; Billing Read permission is required; fail closed."
            exit 1
          }
          printf '%s' "$response" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const body=JSON.parse(s);
              if (body.success!==true || !Array.isArray(body.result)) {
                throw new Error("Malformed Cloudflare subscription response");
              }
              for (const sub of body.result) {
                if (typeof sub.price!=="number") {
                  throw new Error("Subscription cost is not explicitly readable; fail closed");
                }
                if (sub.price!==0) {
                  throw new Error("Non-zero Cloudflare subscription detected; zero-cost gate failed");
                }
              }
              console.log("CLOUDFLARE_ACCOUNT_COST_STATE=ZERO_COST_READ_ONLY_PASS");
            });
          '

      - name: Read current deployment state for target Worker only
        if: steps.request.outputs.mode == 'QUALIFY'
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          output="$(npm exec --workspace @emcore/web -- wrangler deployments status --name emcore-web-pilot --json 2>q1-cloudflare.err)" || {
            code=$?
            echo "Cloudflare read-only Worker access failed; fail closed."
            sed -E 's/[A-Za-z0-9_-]{32,}/[redacted]/g' q1-cloudflare.err
            exit "$code"
          }
          rm -f q1-cloudflare.err
          test -n "$output" || { echo "Cloudflare returned no deployment state; fail closed."; exit 1; }
          printf '%s' "$output" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              JSON.parse(s);
              process.stdout.write("Target Worker read-only deployment state verified.\n");
            });
          '

      - name: Q1 qualification complete
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        run: |
          echo "Q1 PASS: stored Cloudflare credential successfully read deployment state for emcore-web-pilot."
          echo "No Cloudflare mutation or deployment was attempted."
