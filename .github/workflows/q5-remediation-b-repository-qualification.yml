name: EMCORE Q5 Remediation B Repository Qualification

on:
  push:
    branches: [main]
    paths:
      - q5-remediation-b-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q5-remediation-b
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate repository-only request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q5-remediation-b-request.json');
          const expected = {
            schema: 'emcore.q5-remediation-b.v1',
            mode: 'QUALIFY',
            source_repository: 'emcore-project/emcore',
            source_commit: '2d5f531aa45272faae7a2a521d880c75fe3a8651',
            source_tree: '925e3f60b7356a1a679785627168a6740ddd1abc',
            pr_number: 1057,
            deployment_authorized: false,
            provider_access_authorized: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q5 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 2d5f531aa45272faae7a2a521d880c75fe3a8651
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "2d5f531aa45272faae7a2a521d880c75fe3a8651"
          test "$(git rev-parse 'HEAD^{tree}')" = "925e3f60b7356a1a679785627168a6740ddd1abc"
          echo "SOURCE_IDENTITY=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax checks
        working-directory: source
        run: |
          node --check scripts/cloudflare-pilot-deploy.mjs
          node --check scripts/pilot-live-smoke.mjs
          node --check scripts/pilot-readiness-check.mjs
          node --check scripts/v1-release-hardening-check.mjs

      - name: Pilot readiness
        working-directory: source
        run: npm run check:pilot-readiness

      - name: Release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            echo "Browser acceptance first attempt failed; retrying once on a fresh Chrome process."
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert provider isolation
        shell: bash
        run: |
          echo "PROVIDER_ACCESS=NONE"
          echo "CLOUDFLARE_DEPLOY=NONE"
          echo "SUPABASE_MUTATION=NONE"
          echo "CUSTOMER_DATA_MUTATION=NONE"
          echo "Q5_REPOSITORY_QUALIFICATION=PASS"
