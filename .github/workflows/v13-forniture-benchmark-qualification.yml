name: V13 Forniture Benchmark Exact-Head Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v13-forniture-benchmark-qualification.yml'

permissions:
  contents: read

jobs:
  v13_qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: a9262889d1880bc4a626a86284e4606982bf30f5
      TARGET_TREE: c307c8cea0705528d62d62e0e2c67f804085eaf8
      TARGET_PREVIEW: https://visual-v04-forniture-cleanroom-emcore-web-dev.emcore-project.workers.dev
    steps:
      - name: Boundaries
        run: |
          set -euo pipefail
          echo "MISSION=CC77-VISUAL-V13-FORNITURE-BENCHMARK-001"
          echo "SCOPE=V13_FORNITURE_BENCHMARK_ONLY"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "USER_AS_TEST_OPERATOR=NOT_USED"
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"

      - name: Verify exact source and PR state
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$EMCORE_SOURCE_TOKEN"
          pr_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $EMCORE_SOURCE_TOKEN" https://api.github.com/repos/emcore-project/emcore/pulls/1110)"
          test "$(printf '%s' "$pr_json" | jq -r '.head.sha')" = "$TARGET_SHA"
          test "$(printf '%s' "$pr_json" | jq -r '.state')" = "open"
          test "$(printf '%s' "$pr_json" | jq -r '.draft')" = "true"
          test "$(printf '%s' "$pr_json" | jq -r '.merged_at')" = "null"
          commit_json="$(curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $EMCORE_SOURCE_TOKEN" "https://api.github.com/repos/emcore-project/emcore/commits/$TARGET_SHA")"
          test "$(printf '%s' "$commit_json" | jq -r '.commit.tree.sha')" = "$TARGET_TREE"
          echo "SOURCE_SHA=$TARGET_SHA"
          echo "SOURCE_TREE=$TARGET_TREE"
          echo "SOURCE_DRIFT=NONE"

      - name: Exact-head type and build
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:$EMCORE_SOURCE_TOKEN@github.com/emcore-project/emcore.git" /tmp/emcore
          cd /tmp/emcore
          git checkout -q "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          npm ci
          node --experimental-strip-types --test tests/product-preview-technical-facts.test.ts
          npm run check --workspace @emcore/web
          npm run build --workspace @emcore/web
          grep -q "SupplyTechnicalDossier" apps/web/src/FornitureV04Cleanroom.tsx
          grep -q "preloadedFacts" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "from('supply_profile_facts')" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "sourceType: 'SYNTHETIC'" apps/web/src/product-preview-technical-facts.ts
          grep -q "VOLTAGE_LEVEL" apps/web/src/product-preview-technical-facts.ts
          grep -q "REMI_CODE" apps/web/src/product-preview-technical-facts.ts
          grep -q "AVAILABLE_POWER_KW" packages/domain/src/supply-profile-facts.ts
          grep -q "COMMITTED_POWER_KW" packages/domain/src/supply-profile-facts.ts
          grep -q "METER_CLASS" packages/domain/src/supply-profile-facts.ts
          grep -q "REMI_CODE" packages/domain/src/supply-profile-facts.ts
          grep -q "v04__row-detail-affordance" apps/web/src/FornitureV04Cleanroom.tsx
          ! grep -q 'v04__table-action-label">Dettaglio' apps/web/src/FornitureV04Cleanroom.tsx
          grep -q "SemanticStateIcon" apps/web/src/FornitureV04Cleanroom.tsx
          grep -q "v04__renewal-alert" apps/web/src/FornitureV04Cleanroom.tsx
          grep -q "V11 FORNITURE BENCHMARK" apps/web/src/forniture-v04-cleanroom.css
          grep -q -- "--v11-secondary-size:.875rem" apps/web/src/forniture-v04-cleanroom.css
          grep -q "grid-template-columns:minmax(0,1fr) 3.25rem" apps/web/src/forniture-v04-cleanroom.css
          grep -q "V12 FORNITURE BENCHMARK" apps/web/src/forniture-v04-cleanroom.css
          grep -q -- "--v12-operational-meta-size:1rem" apps/web/src/forniture-v04-cleanroom.css
          grep -q -- "--v12-selected:#dcebf7" apps/web/src/forniture-v04-cleanroom.css
          grep -q "contract-term-source-detail" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "contract-term-source-origin" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "Valore" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "Validità" apps/web/src/SupplyTechnicalDossier.tsx
          grep -q "V13 FORNITURE BENCHMARK" apps/web/src/forniture-v04-cleanroom.css
          grep -q -- "--v13-gas:#2F80ED" apps/web/src/forniture-v04-cleanroom.css
          grep -q -- "--v13-ee:#E0A800" apps/web/src/forniture-v04-cleanroom.css
          grep -q "commodity={selected.supply.commodity}" apps/web/src/FornitureV04Cleanroom.tsx
          grep -q "commodityClassName" apps/web/src/FornitureV04Cleanroom.tsx
          echo "GOVERNED_TECHNICAL_SOURCE_WIRING=PASS"
          echo "V13_STATIC_PATTERN_GUARDS=PASS"
          echo "TYPECHECK=PASS"
          echo "BUILD=PASS"

      - name: Verify exact deployed identity
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            raw="$(curl -fsSL "$TARGET_PREVIEW/api/deployment-identity" 2>/dev/null || true)"
            if printf '%s' "$raw" | grep -q "$TARGET_SHA"; then
              echo "$raw" >/tmp/deployment-identity
              break
            fi
            sleep 2
          done
          grep -q "$TARGET_SHA" /tmp/deployment-identity
          echo "ZERO_COST_DEPLOYMENT=PASS"
          echo "DEPLOYMENT_IDENTITY=$TARGET_SHA"
          echo "EXACT_DEPLOYED_IDENTITY=PASS"

      - name: Runtime V13 acceptance matrix
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            npx --yes playwright@1.55.0 install chromium >/tmp/playwright-install.log 2>&1
            chrome="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -print -quit)"
          fi
          test -n "$chrome"
          echo "BROWSER_BINARY=$chrome"
          curl -fsSL --retry 2 --retry-delay 1 "$TARGET_PREVIEW/preview/" -o /tmp/v13-preview-preflight.html
          test -s /tmp/v13-preview-preflight.html
          echo "PREVIEW_HTTP_PREFLIGHT=PASS"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir=/tmp/v13-chrome --window-size=1440,1000 "$TARGET_PREVIEW/preview/#supplies" >/tmp/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi; sleep .5; done
          curl -fsS http://127.0.0.1:9222/json >/tmp/cdp-targets

          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const base=process.env.TARGET_PREVIEW;
            const targets=JSON.parse(fs.readFileSync('/tmp/cdp-targets','utf8'));
            const pageTarget=targets.find(t=>t.type==='page'&&t.url.startsWith(base))||targets.find(t=>t.type==='page');
            if(!pageTarget?.webSocketDebuggerUrl) throw new Error('No page target');
            let seq=0; const pending=new Map(); const exceptions=[];
            const ws=new WebSocket(pageTarget.webSocketDebuggerUrl);
            const ready=new Promise((resolve,reject)=>{ws.addEventListener('open',resolve,{once:true});ws.addEventListener('error',reject,{once:true})});
            ws.addEventListener('message',e=>{
              const m=JSON.parse(String(e.data));
              if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result)}
              else if(m.method==='Runtime.exceptionThrown') exceptions.push(m.params?.exceptionDetails?.text||'runtime exception');
            });
            const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))});
            const evalJs=async(expression)=>{const out=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true,userGesture:true});if(out.exceptionDetails)throw new Error(out.exceptionDetails.text);return out.result?.value};
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const waitFor=async(expression,timeout=15000)=>{const start=Date.now();while(Date.now()-start<timeout){try{if(await evalJs(expression))return}catch{}await sleep(180)}throw new Error('waitFor timeout '+expression)};
            const pass=(id,detail='')=>console.log('CHECK_'+id+'=PASS'+(detail?' | '+detail:''));
            const clickText=async(sel,text)=>{const p=JSON.stringify({sel,text});if(!(await evalJs(`(()=>{const {sel,text}=${p};const r=document.querySelector(sel)||document;const e=[...r.querySelectorAll('button')].find(b=>(b.textContent||'').trim().includes(text));if(!e)return false;e.click();return true})()`)))throw new Error('button not found '+text)};
            const setInput=async(sel,value)=>{const p=JSON.stringify({sel,value});if(!(await evalJs(`(()=>{const {sel,value}=${p};const e=document.querySelector(sel);if(!e)return false;Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(e,value);e.dispatchEvent(new Event('input',{bubbles:true}));return true})()`)))throw new Error('input not found')};
            const load=async(width,height,mobile=false)=>{
              await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile});
              try{
                await waitFor(`document.readyState==='complete'&&!!document.querySelector('.v04')`,8000);
              }catch(firstError){
                const firstDiag=await evalJs(`({href:location.href,title:document.title,ready:document.readyState,body:(document.body?.innerText||'').slice(0,700),html:(document.documentElement?.outerHTML||'').slice(0,2500),scripts:[...document.scripts].map(s=>s.src||'[inline]'),resources:performance.getEntriesByType('resource').map(e=>({name:e.name,initiatorType:e.initiatorType,duration:e.duration})).slice(-30)})`).catch(()=>null);
                console.log('RUNTIME_EXCEPTIONS_1='+JSON.stringify(exceptions));
                console.log('BROWSER_LOAD_DIAG_1='+JSON.stringify(firstDiag));
                await send('Page.navigate',{url:base+'/preview/#supplies'});
                try{
                  await waitFor(`document.readyState==='complete'&&!!document.querySelector('.v04')`,8000);
                }catch(secondError){
                  const secondDiag=await evalJs(`({href:location.href,title:document.title,ready:document.readyState,body:(document.body?.innerText||'').slice(0,700),html:(document.documentElement?.outerHTML||'').slice(0,2500),scripts:[...document.scripts].map(s=>s.src||'[inline]'),resources:performance.getEntriesByType('resource').map(e=>({name:e.name,initiatorType:e.initiatorType,duration:e.duration})).slice(-30)})`).catch(()=>null);
                  console.log('RUNTIME_EXCEPTIONS_2='+JSON.stringify(exceptions));
                  console.log('BROWSER_LOAD_DIAG_2='+JSON.stringify(secondDiag));
                  throw secondError;
                }
              }
              if(await evalJs(`!!document.querySelector('[data-testid="supply-detail-page"]')`)){
                await evalJs(`document.querySelector('.v04__back')?.click();true`);
              }
              await waitFor(`document.querySelectorAll('.v04__row').length>=2`);
              await sleep(220);
            };
            const viewport=async(width,height,mobile=false)=>{
              await load(width,height,mobile);
              const metrics=await evalJs(`(()=>({w:innerWidth,doc:document.documentElement.scrollWidth,body:document.body.scrollWidth,sort:(()=>{const e=document.querySelector('.v04__sort');if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,right:r.right,parentRight:e.parentElement.getBoundingClientRect().right}})()}))()`);
              if(metrics.doc>width+1||metrics.body>width+1) throw new Error('page horizontal overflow '+width+' '+JSON.stringify(metrics));
              if(metrics.sort&&(metrics.sort.left<0||metrics.sort.right>metrics.sort.parentRight+1)) throw new Error('sort overflow '+width+' '+JSON.stringify(metrics.sort));
              pass('VIEWPORT_'+width+'X'+height);
            };
            const assertSingleLine=async(label)=>{
              const proof=await evalJs(`(()=>{const list=[...document.querySelectorAll('.v04__supply-code')].filter(e=>e.offsetParent!==null);return list.map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {text:e.textContent.trim(),white:s.whiteSpace,height:r.height,line:parseFloat(s.lineHeight)||parseFloat(s.fontSize)*1.4,scroll:e.scrollWidth,client:e.clientWidth}})})()`);
              if(!proof.length||proof.some(x=>x.white!=='nowrap'||x.height>x.line*1.6)) throw new Error(label+' identifier wrap '+JSON.stringify(proof));
              pass(label,JSON.stringify(proof));
            };

            await ready; await send('Runtime.enable'); await send('Page.enable');

            await load(1440,1000,false);
            await assertSingleLine('POD_PDR_SINGLE_LINE_DESKTOP');

            const calm=await evalJs(`(()=>{const p=getComputedStyle(document.querySelector('.v04__primary'));const n=getComputedStyle(document.querySelector('.v04__nav button.is-active'));const f=getComputedStyle(document.querySelector('.v04__filters button.is-active'));return {primaryBg:p.backgroundImage,navBg:n.backgroundImage,filterBg:f.backgroundImage,primaryColor:p.backgroundColor,navColor:n.backgroundColor,filterColor:f.backgroundColor}})()`);
            if(calm.primaryBg!=='none'||calm.navBg!=='none'||calm.filterBg!=='none') throw new Error('gradient remained in equivalent action state '+JSON.stringify(calm));
            pass('CALM_UNIFORM_ACTION_STATES',JSON.stringify(calm));

            const sidebar=await evalJs(`(()=>({logo:!!document.querySelector('.v04__brand-mark svg'),orbit:!!document.querySelector('.v04__brand-orbit'),letter:!!document.querySelector('.v04__brand-e'),pulse:!!document.querySelector('.v04__brand-pulse'),literalLandscape:!!document.querySelector('.v04__brand-sun,.v04__brand-ridge,.v04__brand-wave'),tagline:(document.querySelector('.v04__sidebar-tagline')?.innerText||''),bg:getComputedStyle(document.querySelector('.v04__sidebar')).backgroundImage}))()`);
            if(!sidebar.logo||!sidebar.orbit||!sidebar.letter||!sidebar.pulse||sidebar.literalLandscape||!sidebar.tagline.includes('Energia sotto controllo')||!sidebar.bg.includes('gradient')) throw new Error('sidebar brand proof '+JSON.stringify(sidebar));
            pass('SIDEBAR_EMCORE_MARK',JSON.stringify(sidebar));

            const renewal=await evalJs(`(()=>({kpi:[...document.querySelectorAll('.v04__kpi')].some(e=>(e.textContent||'').includes('Rinnovi entro 120 giorni')&&e.classList.contains('is-attention')),snapshot:document.querySelector('.v04__snapshot-next')?.className||'',row:[...document.querySelectorAll('.v04__renewal-cell')].some(e=>e.classList.contains('is-attention'))}))()`);
            if(!renewal.kpi||!renewal.snapshot.includes('is-attention')||!renewal.row) throw new Error('renewal semantic mismatch '+JSON.stringify(renewal));
            pass('RENEWAL_120_DAY_SEMANTICS',JSON.stringify(renewal));
            const renewalLanguage=await evalJs(`(()=>{const e=document.querySelector('.v04__renewal-cell.is-attention');return e?{icon:!!e.querySelector('.v04__renewal-alert svg'),text:(e.textContent||'').trim(),legacyDot:getComputedStyle(e,'::before').content}:null})()`);
            if(!renewalLanguage||!renewalLanguage.icon||!renewalLanguage.text.includes('entro 120 gg')||(renewalLanguage.legacyDot!=='none'&&renewalLanguage.legacyDot!=='normal')) throw new Error('renewal semantic language '+JSON.stringify(renewalLanguage));
            pass('RENEWAL_NON_DOT_LANGUAGE',JSON.stringify(renewalLanguage));

            const semanticStatus=await evalJs(`(()=>{const statuses=[...document.querySelectorAll('.v04__status')].filter(e=>e.offsetParent!==null);const lines=[...document.querySelectorAll('.v04__status-line')].filter(e=>e.offsetParent!==null);return {statuses:statuses.map(e=>({text:(e.textContent||'').trim(),icon:!!e.querySelector('.v04__state-icon svg'),dotVisible:[...e.querySelectorAll('i,.v04__dot')].some(d=>getComputedStyle(d).display!=='none')})),lines:lines.map(e=>({text:(e.textContent||'').trim(),icon:!!e.querySelector('.v04__state-icon svg'),dotVisible:[...e.querySelectorAll('.v04__dot')].some(d=>getComputedStyle(d).display!=='none')}))}})()`);
            if(!semanticStatus.statuses.length||semanticStatus.statuses.some(x=>!x.text||!x.icon||x.dotVisible)||semanticStatus.lines.some(x=>!x.text||!x.icon||x.dotVisible)) throw new Error('semantic state language regression '+JSON.stringify(semanticStatus));
            pass('NON_COLOR_ONLY_SEMANTIC_STATUS',JSON.stringify(semanticStatus));

            const lighterSemantic=await evalJs(`(()=>{const status=[...document.querySelectorAll('.v04__status')].filter(e=>e.offsetParent!==null).map(e=>{const s=getComputedStyle(e);const icon=e.querySelector('.v04__state-icon');const i=icon?getComputedStyle(icon):null;return {text:(e.textContent||'').trim(),border:parseFloat(s.borderTopWidth),bg:s.backgroundColor,iconBorder:i?parseFloat(i.borderTopWidth):null,iconBg:i?.backgroundColor||''}});const renewal=document.querySelector('.v04__renewal-alert');const rs=renewal?getComputedStyle(renewal):null;return {status,renewal:rs?{border:parseFloat(rs.borderTopWidth),bg:rs.backgroundColor}:null}})()`);
            if(!lighterSemantic.status.length||lighterSemantic.status.some(x=>x.border>0.1||x.iconBorder>0.1||x.bg==='rgba(0, 0, 0, 0)'||x.iconBg==='rgba(0, 0, 0, 0)')||(lighterSemantic.renewal&&lighterSemantic.renewal.border>0.1)) throw new Error('pronounced semantic outline remained '+JSON.stringify(lighterSemantic));
            pass('LIGHTER_SEMANTIC_ICON_STATUS',JSON.stringify(lighterSemantic));
            pass('NO_PRONOUNCED_OUTLINE_REGRESSION');
            pass('EQUIVALENT_SEMANTIC_INDICATORS_CONSISTENT');

            const labelProof=await evalJs(`(()=>{const e=document.querySelector('.v04__snapshot .v04__kv span');const s=getComputedStyle(e);return {size:parseFloat(s.fontSize),weight:parseInt(s.fontWeight),color:s.color}})()`);
            if(labelProof.size<14||labelProof.weight<700) throw new Error('label legibility '+JSON.stringify(labelProof));
            pass('CARD_LABEL_LEGIBILITY',JSON.stringify(labelProof));

            const tableLayout=await evalJs(`(()=>{const head=document.querySelector('.v04__table-head');const row=document.querySelector('.v04__row');const action=row?.querySelector('.v04__row-detail');const sorts=[...document.querySelectorAll('.v04__sort-header')].map(e=>{const label=e.querySelector('span')?.getBoundingClientRect();const icon=e.querySelector('svg')?.getBoundingClientRect();return {labelRight:label?.right,iconLeft:icon?.left,gap:label&&icon?icon.left-label.right:null}});const ar=action?.getBoundingClientRect();return {visibleDetailHeader:[...head.querySelectorAll('span')].some(e=>(e.textContent||'').trim().toLowerCase()==='dettaglio'),headChildren:head.children.length,actionWidth:ar?.width,actionHeight:ar?.height,aria:action?.getAttribute('aria-label')||'',tooltip:(action?.querySelector('.v04__row-detail-affordance')?.textContent||'').trim(),sorts}})()`);
            if(tableLayout.visibleDetailHeader||tableLayout.headChildren!==6||tableLayout.actionWidth>53||tableLayout.actionWidth<48||tableLayout.actionHeight<44||!tableLayout.aria.includes('Apri dettaglio fornitura')||tableLayout.tooltip!=='Apri dettaglio'||tableLayout.sorts.some(x=>x.gap!==null&&x.gap<8)) throw new Error('V13 compact detail action '+JSON.stringify(tableLayout));
            pass('COMPACT_DETAIL_ACTION',JSON.stringify(tableLayout));

            const tableAxis=await evalJs(`(()=>{const head=[...document.querySelector('.v04__table-head').children][5];const status=document.querySelector('.v04__row .v04__row-select .v04__status');const h=head?.getBoundingClientRect(),s=status?.getBoundingClientRect();return h&&s?{headerLeft:h.left,statusLeft:s.left,delta:Math.abs(h.left-s.left)}:null})()`);
            if(!tableAxis||tableAxis.delta>2) throw new Error('STATO axis drift '+JSON.stringify(tableAxis));
            pass('STATO_HEADER_ALIGNMENT',JSON.stringify(tableAxis));

            const rowStates=await evalJs(`(()=>{const rows=[...document.querySelectorAll('.v04__row')];const selected=rows.find(e=>e.classList.contains('is-selected'));const normal=rows.find(e=>!e.classList.contains('is-selected'));const head=document.querySelector('.v04__table-head');if(!selected||!normal||!head)return null;const cs=e=>getComputedStyle(e);return {selectedBg:cs(selected).backgroundImage+'|'+cs(selected).backgroundColor,normalBg:cs(normal).backgroundImage+'|'+cs(normal).backgroundColor,headerBg:cs(head).backgroundImage+'|'+cs(head).backgroundColor,selectedShadow:cs(selected).boxShadow}})()`);
            if(!rowStates||rowStates.selectedBg===rowStates.normalBg||rowStates.selectedBg===rowStates.headerBg||!rowStates.selectedShadow.includes('inset')) throw new Error('selected row distinction '+JSON.stringify(rowStates));
            pass('SELECTED_VS_NORMAL_DISTINCTION',JSON.stringify(rowStates));
            pass('SELECTED_VS_HEADER_DISTINCTION');
            await evalJs(`(()=>{const e=[...document.querySelectorAll('.v04__row')].find(x=>!x.classList.contains('is-selected'));e?.scrollIntoView({block:'center'});return true})()`);
            const hoverCenter=await evalJs(`(()=>{const e=[...document.querySelectorAll('.v04__row')].find(x=>!x.classList.contains('is-selected'));const r=e?.getBoundingClientRect();return r?{x:r.left+Math.min(r.width/2,300),y:r.top+r.height/2}:null})()`);
            if(hoverCenter){await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:hoverCenter.x,y:hoverCenter.y});await sleep(120)}
            const hoverBg=await evalJs(`(()=>{const e=[...document.querySelectorAll('.v04__row')].find(x=>!x.classList.contains('is-selected'));if(!e)return null;const s=getComputedStyle(e);return s.backgroundImage+'|'+s.backgroundColor})()`);
            if(!hoverBg||hoverBg===rowStates.selectedBg||hoverBg===rowStates.normalBg) throw new Error('selected/hover distinction '+JSON.stringify({rowStates,hoverBg}));
            pass('SELECTED_VS_HOVER_DISTINCTION',hoverBg);
            if(/rgb\((?:2[0-5]{2}|1\d{2}),\s*(?:[0-9]{1,2}),\s*(?:[0-9]{1,2})\)/.test(rowStates.selectedBg)) throw new Error('selected resembles attention');
            pass('SELECTED_REMAINS_NON_ATTENTION');

            await evalJs(`(()=>{const e=document.querySelector('.v04__row-detail');e.scrollIntoView({block:'nearest',inline:'nearest'});return true})()`);
            await sleep(120);
            const actionCenter=await evalJs(`(()=>{const e=document.querySelector('.v04__row-detail');const r=e.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,left:r.left,right:r.right,viewport:innerWidth}})()`);
            if(actionCenter.x<0||actionCenter.x>actionCenter.viewport) throw new Error('detail action not in pointer viewport '+JSON.stringify(actionCenter));
            await send('Input.dispatchMouseEvent',{type:'mouseMoved',x:actionCenter.x,y:actionCenter.y});
            await sleep(180);
            const hoverAffordance=await evalJs(`(()=>{const e=document.querySelector('.v04__row-detail-affordance');const s=getComputedStyle(e);return {opacity:parseFloat(s.opacity),visibility:s.visibility,text:(e.textContent||'').trim()}})()`);
            if(hoverAffordance.opacity<0.9||hoverAffordance.visibility!=='visible'||hoverAffordance.text!=='Apri dettaglio') throw new Error('pointer detail affordance '+JSON.stringify(hoverAffordance));
            pass('DETAIL_POINTER_AFFORDANCE',JSON.stringify(hoverAffordance));
            await evalJs(`document.querySelector('.v04__row-detail').focus();true`);
            await sleep(80);
            const focusAffordance=await evalJs(`(()=>{const e=document.querySelector('.v04__row-detail-affordance');const s=getComputedStyle(e);return {focused:document.activeElement?.classList.contains('v04__row-detail'),opacity:parseFloat(s.opacity),visibility:s.visibility}})()`);
            if(!focusAffordance.focused||focusAffordance.opacity<0.9||focusAffordance.visibility!=='visible') throw new Error('keyboard detail affordance '+JSON.stringify(focusAffordance));
            pass('DETAIL_KEYBOARD_AFFORDANCE',JSON.stringify(focusAffordance));

