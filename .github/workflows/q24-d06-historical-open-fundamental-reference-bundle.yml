name: EMCORE Q24 D06 Historical Open Fundamental Reference Bundle Qualification

on:
  push:
    branches: [main]
    paths:
      - q24-d06-historical-open-fundamental-reference-bundle-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q24-d06-historical-open-fundamental-reference-bundle
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q24-d06-historical-open-fundamental-reference-bundle-request.json');
          const expected = {
            schema: 'emcore.q24-d06-historical-open-fundamental-reference-bundle.v1',
            mode: 'QUALIFY',
            mission: 'CC25-D06-GOVERNED-HISTORICAL-OPEN-FUNDAMENTAL-REFERENCE-BUNDLE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: 'a2dd9988b1d463e858e66ea7c8c8a659289ed9b2',
            source_baseline: '5c26879937bc17331bd505e6720691600898b630',
            live_open_source_access_authorized: false,
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            customer_data_authorized: false,
            customer_ingestion_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            market_benchmark_ingestion_authorized: false,
            restricted_training_calibration_authorized: false,
            price_fair_value_engine_authorized: false,
            final_scenario_auto_execution_authorized: false,
            fixing_execution_authorized: false,
            trading_execution_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q24 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: a2dd9988b1d463e858e66ea7c8c8a659289ed9b2
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a2dd9988b1d463e858e66ea7c8c8a659289ed9b2"
          test -z "$(git status --porcelain)"
          git cat-file -e 5c26879937bc17331bd505e6720691600898b630^{commit}
          changed="$(git diff --name-only 5c26879937bc17331bd505e6720691600898b630..HEAD)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -E '^(\.github/workflows/|supabase/|package\.json$|package-lock\.json$|apps/web/wrangler|scripts/cloudflare|scripts/pilot-live)'; then
            echo "Forbidden deployment/dependency scope change" >&2
            exit 1
          fi
          unexpected="$(echo "$changed" | grep -Ev '^(packages/server/src/historical-open-fundamental-reference-bundle\.ts|apps/web/src/HistoricalReferenceBundleDevPanel\.tsx|apps/web/src/MarketOpportunitiesDevSurface\.tsx|tests/governed-historical-open-fundamental-reference-bundle\.test\.ts)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused historical reference bundle tests
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/governed-historical-open-fundamental-reference-bundle.test.ts \
            tests/governed-open-fundamental-reference-baselines.test.ts \
            tests/governed-independent-fundamental-scenario-engine.test.ts \
            tests/governed-live-open-fundamental-bundle.test.ts \
            tests/governed-fundamental-feature-pipeline.test.ts \
            tests/governed-fundamental-market-consistency-bridge.test.ts \
            tests/market-opportunities-dev-surface.test.ts \
            tests/portal-navigation.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert historical bundle safety rights isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          ! grep -RE "setInterval\(|setTimeout\(" packages/server/src/historical-open-fundamental-reference-bundle.ts apps/web/src/HistoricalReferenceBundleDevPanel.tsx
          ! grep -RE "EEX_FORWARD|GME_FORWARD|ICE_FORWARD|MONTEL_LICENSED|fairValue|EUR/MWh|priceForecast:" packages/server/src/historical-open-fundamental-reference-bundle.ts
          grep -q "automaticRuntimeFetching: false" packages/server/src/historical-open-fundamental-reference-bundle.ts
          grep -q "finalScenarioAutoExecution: false" packages/server/src/historical-open-fundamental-reference-bundle.ts
          node --experimental-strip-types --input-type=module <<'NODE'
          import { SOURCE_INTELLIGENCE_DATASETS } from './packages/domain/src/source-intelligence.ts';
          for (const key of ['EEX_FORWARD_LICENSED_SLOT','GME_FORWARD_LICENSED_SLOT','ICE_FORWARD_LICENSED_SLOT','MONTEL_LICENSED_SLOT']) {
            if (SOURCE_INTELLIGENCE_DATASETS[key].activationState !== 'OFF') throw new Error(key + ' unexpectedly active');
          }
          console.log('AUTOMATIC_RUNTIME_FETCHING=OFF');
          console.log('LICENSED_MARKET_SLOTS=OFF');
          console.log('HISTORICAL_REFERENCE_MARKET_BENCHMARK=NONE');
          console.log('NASA_FORECAST_PROMOTION=PROHIBITED');
          console.log('ECMWF_HISTORICAL_ARCHIVE=FAIL_CLOSED');
          console.log('EDF_EVENT_BASELINE=FAIL_CLOSED');
          console.log('POWER_SUPPLY_AVAILABILITY=FAIL_CLOSED');
          console.log('FINAL_SCENARIO_AUTO_EXECUTION=OFF');
          console.log('PRICE_FAIR_VALUE_ENGINE=NONE');
          console.log('FIXING_EXECUTION=NONE');
          console.log('TRADING_EXECUTION=NONE');
          NODE
          echo "LIVE_OPEN_SOURCE_ACCESS_DURING_QUALIFICATION=NONE"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "MARKET_BENCHMARK_INGESTION=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "CUSTOMER_INGESTION=NONE"
          echo "DEPLOYMENT=NONE"
          echo "RESTRICTED_TRAINING_CALIBRATION=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q24_D06_HISTORICAL_OPEN_FUNDAMENTAL_REFERENCE_BUNDLE=PASS"
