name: EMCORE Q8 D06 Forward Scenario Qualification

on:
  push:
    branches: [main]
    paths:
      - q8-d06-forward-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q8-d06-forward
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate repository-only request
        run: |
          node <<'NODE'
          const r = require('./q8-d06-forward-request.json');
          const expected = {
            schema: 'emcore.q8-d06-forward.v1',
            mode: 'QUALIFY',
            source_repository: 'emcore-project/emcore',
            source_commit: '495bb31c196d629571b8e9c0999910eaa6a2b2f0',
            source_tree: '8df341c986445885ad319f3da161321acf3b987e',
            provider_access_authorized: false,
            customer_data_authorized: false,
            ingestion_authorized: false,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q8 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 495bb31c196d629571b8e9c0999910eaa6a2b2f0
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "495bb31c196d629571b8e9c0999910eaa6a2b2f0"
          test "$(git rev-parse 'HEAD^{tree}')" = "8df341c986445885ad319f3da161321acf3b987e"
          echo "SOURCE_IDENTITY=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused D06 tests
        working-directory: source
        run: node --experimental-strip-types --test tests/forward-scenario-engine.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Assert provider isolation
        run: |
          echo "PROVIDER_ACCESS=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "ZERO_COST=PASS"
          echo "Q8_D06_FORWARD_QUALIFICATION=PASS"
