name: EMCORE Q33 D10 Governed Obligation Deadline Decision Window Qualification

on:
  push:
    branches: [main]
    paths:
      - q33-d10-governed-obligation-deadline-engine-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q33-d10-governed-obligation-deadline-engine
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q33-d10-governed-obligation-deadline-engine-request.json');
          const expected = {
            schema: 'emcore.q33-d10-governed-obligation-deadline-engine.v1',
            mode: 'QUALIFY',
            mission: 'CC29-D10-GOVERNED-OBLIGATION-DEADLINE-DECISION-WINDOW-ENGINE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: 'e9eb06ceb64aadd9cabb5cba40cc64186f39fc9f',
            source_baseline: '8674507096fc4c0fa73133f723f12111b434df63',
            notification_delivery_authorized: false,
            external_execution_authorized: false,
            customer_outreach_authorized: false,
            supplier_distributor_authority_outreach_authorized: false,
            production_customer_data_enablement_authorized: false,
            proprietary_data_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q33 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: e9eb06ceb64aadd9cabb5cba40cc64186f39fc9f
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "e9eb06ceb64aadd9cabb5cba40cc64186f39fc9f"
          test -z "$(git status --porcelain)"
          git cat-file -e 8674507096fc4c0fa73133f723f12111b434df63^{commit}
          changed="$(git diff --name-only 8674507096fc4c0fa73133f723f12111b434df63..HEAD)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/governed-obligation-deadline-engine\.ts|packages/domain/src/governed-fixing-hedging-portfolio-decision\.ts|apps/web/src/GovernedObligationDeadlineDevSurface\.tsx|apps/web/src/CustomerPortal\.tsx|apps/web/src/portal-navigation\.ts|tests/governed-obligation-deadline-engine\.test\.ts|tests/governed-obligation-deadline-dev-surface\.test\.ts|tests/portal-navigation\.test\.ts|scripts/browser-acceptance\.mjs)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D10 D09 D08 D07 D06 Q29 regression tests
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/governed-obligation-deadline-engine.test.ts \
            tests/governed-obligation-deadline-dev-surface.test.ts \
            tests/governed-connection-supply-practice-engine.test.ts \
            tests/governed-connection-supply-practice-dev-surface.test.ts \
            tests/governed-fixing-hedging-portfolio-decision.test.ts \
            tests/governed-fixing-hedging-portfolio-dev-panel.test.ts \
            tests/governed-offer-comparison-procurement-decision.test.ts \
            tests/governed-offer-comparison-procurement-dev-panel.test.ts \
            tests/governed-gas-commercial-structure-parity.test.ts \
            tests/market-opportunities-dev-surface.test.ts \
            tests/governed-italy-native-supply-availability.test.ts \
            tests/governed-scenario-market-consistency-orchestration.test.ts \
            tests/portal-navigation.test.ts \
            tests/r01-governed-distribution-lifecycle-events.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert D10 safety integration and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          files="packages/domain/src/governed-obligation-deadline-engine.ts apps/web/src/GovernedObligationDeadlineDevSurface.tsx"
          ! grep -RE "fetch\(|axios|sendReminder|sendNotification|contactSupplier|contactDistributor|contactAuthority|executeExternal|setInterval|setTimeout" $files
          grep -q "D10_OBLIGATION_FAMILIES" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "DERIVED_TEMPORAL_RULE_REQUIRES_VALIDATED_TRIGGER" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "WORKING_DAY_RULE_REQUIRES_GOVERNED_CALENDAR" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "completionRequiresExplicitEvidence: true" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "elapsedTimeCreatesSubmission: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "elapsedTimeCreatesCompletion: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "customerMissedObligation" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "externalActorSlaMissed" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "evaluateGovernedObligationPortfolio" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "toD08DecisionWindowProjection" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "toD09PracticeDeadlineProjection" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "notificationDeliveryAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "automaticExternalExecutionAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "customerOutreachAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "supplierDistributorAuthorityOutreachAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "productionCustomerDataEnablementAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "proprietaryDataAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "paidFeedAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "scrapingAuthorized: false" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "q29ItalyReadinessUnchanged: true" packages/domain/src/governed-obligation-deadline-engine.ts
          grep -q "D10DecisionWindowProjection" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          echo "D10_GOVERNED_OBLIGATION_DEADLINE_ENGINE=PASS"
          echo "CROSS_DOMAIN_OBLIGATION_MODEL=PASS"
          echo "TEMPORAL_SEPARATION=PASS"
          echo "GOVERNED_CALENDAR_DERIVATION=PASS"
          echo "ROOT_OBLIGATION_DEDUPLICATION=PASS"
          echo "D15_ACTION_ENGINE_REUSE=PASS"
          echo "D08_D09_INTEGRATION=PASS"
          echo "DETERMINISTIC_REPLAY=PASS"
          echo "NOTIFICATION_DELIVERY=NONE"
          echo "EXTERNAL_EXECUTION=NONE"
          echo "CUSTOMER_OUTREACH=NONE"
          echo "SUPPLIER_DISTRIBUTOR_AUTHORITY_OUTREACH=NONE"
          echo "PRODUCTION_CUSTOMER_DATA=NONE"
          echo "PAID_PROPRIETARY_DATA=NONE"
          echo "SCRAPING=NONE"
          echo "AUTOMATIC_RUNTIME_FETCHING=OFF"
          echo "Q29_READINESS_BYPASS=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q33_D10_GOVERNED_OBLIGATION_DEADLINE_ENGINE=PASS"
