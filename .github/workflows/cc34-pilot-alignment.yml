name: EMCORE CC34 PILOT Current-Main Alignment

on:
  push:
    branches: [main]
    paths:
      - cc34-pilot-alignment-request.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: emcore-cc34-pilot-alignment
  cancel-in-progress: false

jobs:
  deploy-and-accept:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate governed request
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('cc34-pilot-alignment-request.json','utf8'));
          const required={
            schema:'emcore.cc34-pilot-alignment.v1',
            mode:'DEPLOY_ACCEPT',
            source_repository:'emcore-project/emcore',
            release_commit:'7032662079be0be02d3ab78aa535aa3c3cfde85a',
            release_tree:'a6c4c9a4909e607cab3af2a4f704a8414b3027a9',
            expected_open_pr_count:0,
            prior_live_commit:'3f5063c1bad543fc48347c472148f024b29dd583',
            target_worker:'emcore-web-pilot',
            target_config:'apps/web/wrangler.pilot.jsonc',
            pilot_base_url:'https://emcore-web-pilot.emcore-project.workers.dev',
            pilot_bootstrap_url:'https://qogvvvqqkipmstajvhzl.supabase.co/functions/v1/emcore-live-pilot-smoke-bootstrap',
            zero_cost_required:true,
            customer_data_allowed:false,
            ingestion_must_remain_disabled:true,
            deployment_authorized:true
          };
          for(const [k,v] of Object.entries(required)) if(r[k]!==v) throw new Error('request mismatch for '+k);
          NODE

      - name: Require governed secrets
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$EMCORE_SOURCE_TOKEN" || { echo "EMCORE_SOURCE_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing"; exit 1; }

      - name: Checkout exact private EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 7032662079be0be02d3ab78aa535aa3c3cfde85a
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity and zero open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          cd source
          test "$(git rev-parse HEAD)" = "7032662079be0be02d3ab78aa535aa3c3cfde85a"
          test "$(git rev-parse 'HEAD^{tree}')" = "a6c4c9a4909e607cab3af2a4f704a8414b3027a9"
          cd ..
          count="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')"
          test "$count" = "0"
          echo "SOURCE_IDENTITY=PASS"
          echo "OPEN_PR_COUNT=0"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Re-run PILOT readiness
        working-directory: source
        run: npm run check:pilot-readiness

      - name: Re-run release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Re-run exact predeploy gate
        working-directory: source
        env:
          EMCORE_RELEASE_COMMIT: 7032662079be0be02d3ab78aa535aa3c3cfde85a
          EMCORE_RELEASE_TREE: a6c4c9a4909e607cab3af2a4f704a8414b3027a9
          EMCORE_OPEN_RELEASE_PRS: '0'
          EMCORE_C6_ACCEPTED: 'true'
          EMCORE_C7_ACCEPTED: 'true'
          EMCORE_G9_ACCEPTED: 'true'
          EMCORE_WAVE1_ACCEPTED: 'true'
          EMCORE_WAVE2_ACCEPTED: 'true'
          EMCORE_ZERO_COST_VERIFIED: 'true'
        run: npm run check:release-predeploy

      - name: Verify safe live baseline before mutation
        shell: bash
        run: |
          node <<'NODE'
          const base='https://emcore-web-pilot.emcore-project.workers.dev';
          const i=await fetch(base+'/api/deployment-identity',{headers:{accept:'application/json'}});
          if(!i.ok) throw new Error('pre-deploy identity HTTP '+i.status);
          const ib=await i.json();
          if(!['3f5063c1bad543fc48347c472148f024b29dd583','7032662079be0be02d3ab78aa535aa3c3cfde85a'].includes(ib.commitSha)) throw new Error('unexpected live commit '+ib.commitSha);
          const r=await fetch(base+'/api/runtime-config',{headers:{accept:'application/json'}});
          if(!r.ok) throw new Error('runtime-config HTTP '+r.status);
          const b=await r.json();
          if(b.supabaseUrl!=='https://qogvvvqqkipmstajvhzl.supabase.co') throw new Error('wrong Supabase binding');
          if(b.authMode!=='magic_link_mfa') throw new Error('wrong auth mode');
          if(b.documentIngestionEnabled!==false) throw new Error('ingestion not frozen');
          if(b.allowedOrganizationId!=='00605bb8-3899-406e-a428-d7779e856bb2') throw new Error('wrong org boundary');
          console.log('PREDEPLOY_LIVE_SAFETY=PASS');
          console.log('PREDEPLOY_LIVE_COMMIT='+ib.commitSha);
          NODE

      - name: Deploy exact current main once if needed
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMCORE_PILOT_COST_MODE: zero
          WORKERS_CI_COMMIT_SHA: 7032662079be0be02d3ab78aa535aa3c3cfde85a
        run: |
          set +x
          current="$(node -e "fetch('https://emcore-web-pilot.emcore-project.workers.dev/api/deployment-identity').then(async r=>{if(!r.ok)process.exit(2);const b=await r.json();process.stdout.write(b.commitSha||'')})")"
          if [ "$current" = "7032662079be0be02d3ab78aa535aa3c3cfde85a" ]; then
            echo "DEPLOYMENT_REQUIRED=NO_ALREADY_CURRENT"
          else
            echo "DEPLOYMENT_REQUIRED=YES"
            npm run deploy:cloudflare:pilot -- apps/web/wrangler.pilot.jsonc
          fi

      - name: Verify provider deployment state read-only
        working-directory: source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +x
          output="$(npm exec --workspace @emcore/web -- wrangler deployments status --name emcore-web-pilot --json)"
          test -n "$output"
          printf '%s' "$output" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d).on("end",()=>{
              const x=JSON.parse(s); const d=Array.isArray(x)?x[0]:x; const v=d?.versions?.[0]??{};
              console.log("PROVIDER_DEPLOYMENT_STATE=PASS");
              if(d?.id) console.log("ACTIVE_DEPLOYMENT_ID="+d.id);
              if(v?.version_id) console.log("ACTIVE_VERSION_ID="+v.version_id);
              if(v?.percentage!=null) console.log("ACTIVE_TRAFFIC_PERCENT="+v.percentage);
              if(d?.created_on) console.log("ACTIVE_CREATED_ON="+d.created_on);
            });'

      - name: Verify exact live identity and runtime
        shell: bash
        run: |
          node <<'NODE'
          const base='https://emcore-web-pilot.emcore-project.workers.dev';
          const expected='7032662079be0be02d3ab78aa535aa3c3cfde85a';
          const i=await fetch(base+'/api/deployment-identity',{headers:{accept:'application/json'}});
          if(!i.ok) throw new Error('deployment identity HTTP '+i.status);
          const ib=await i.json();
          if(ib.commitSha!==expected) throw new Error('live deployment identity mismatch');
          const r=await fetch(base+'/api/runtime-config',{headers:{accept:'application/json'}});
          if(!r.ok) throw new Error('runtime-config HTTP '+r.status);
          const b=await r.json();
          const exact={
            supabaseUrl:'https://qogvvvqqkipmstajvhzl.supabase.co',
            authMode:'magic_link_mfa',
            documentIngestionEnabled:false,
            allowedOrganizationId:'00605bb8-3899-406e-a428-d7779e856bb2'
          };
          for(const [k,v] of Object.entries(exact)) if(b[k]!==v) throw new Error('runtime mismatch '+k);
          console.log('DEPLOYMENT_IDENTITY=PASS');
          console.log('LIVE_COMMIT='+ib.commitSha);
          console.log('RUNTIME_CONFIG=PASS');
          NODE

      - name: Run canonical public PILOT smoke
        working-directory: source
        env:
          EMCORE_PILOT_BASE_URL: https://emcore-web-pilot.emcore-project.workers.dev
          EMCORE_PILOT_ORGANIZATION_ID: 00605bb8-3899-406e-a428-d7779e856bb2
          EMCORE_PILOT_EXPECTED_COMMIT: 7032662079be0be02d3ab78aa535aa3c3cfde85a
        run: npm run test:pilot:live

      - name: Run automated synthetic AAL1/AAL2 acceptance
        working-directory: source
        env:
          EMCORE_PILOT_BASE_URL: https://emcore-web-pilot.emcore-project.workers.dev
          EMCORE_PILOT_BOOTSTRAP_URL: https://qogvvvqqkipmstajvhzl.supabase.co/functions/v1/emcore-live-pilot-smoke-bootstrap
          EMCORE_PILOT_EXPECTED_COMMIT: 7032662079be0be02d3ab78aa535aa3c3cfde85a
        run: npm run test:pilot:aal2

      - name: Terminal safety record
        run: |
          echo "CC34_PILOT_ALIGNMENT=PASS"
          echo "CUSTOMER_DATA_MUTATION=NONE"
          echo "CUSTOMER_ONBOARDING=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "SUPABASE_SCHEMA_MUTATION=NONE"
          echo "EDGE_FUNCTION_MUTATION=NONE"
          echo "CLOUDFLARE_PERMISSION_CHANGE=NONE"
          echo "TOKEN_CHANGE=NONE"
          echo "ZERO_COST=PRESERVED"
