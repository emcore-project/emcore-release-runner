name: CC48 D04 Mission Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cc48-d04-mission-qualification.yml'

permissions:
  contents: read

concurrency:
  group: emcore-cc48-d04-mission-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prove runner allocation
        run: echo "RUNNER_ALLOCATION=PASS"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 4b899e9eb123b79cf79ff313475db81da9936557
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact identity and D04 boundary
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4b899e9eb123b79cf79ff313475db81da9936557"
          test "$(git rev-parse 'HEAD^{tree}')" = "a9aa8407843ee76e80596d6297997cf2155ba2ff"
          git cat-file -e 8a99c4a3b6f6737f32e9ddb98e54a40f30c58f3c^{commit}
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const expected = [
            'apps/web/src/D04InvoiceControlPanel.tsx',
            'apps/web/src/SupplyContractDossier.tsx',
            'packages/rules/src/governed-invoice-cost-position.ts',
            'packages/server/src/invoice-cost-position-persistence.ts',
            'supabase/migrations/20260922190000_d04_invoice_cost_position.sql',
            'tests/d04-invoice-cost-position.test.ts'
          ].sort();
          const out = execFileSync('git',['diff','--name-only','8a99c4a3b6f6737f32e9ddb98e54a40f30c58f3c..HEAD'],{encoding:'utf8'}).trim();
          const actual = out ? out.split('\n').filter(Boolean).sort() : [];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('D04 boundary mismatch: '+JSON.stringify(actual));
          console.log('D04_SOURCE_SCOPE_BOUNDARY=PASS');
          NODE
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1097||p[0].head.sha!=="4b899e9eb123b79cf79ff313475db81da9936557"||p[0].base.sha!=="8a99c4a3b6f6737f32e9ddb98e54a40f30c58f3c")process.exit(2);console.log("OPEN_PR_IDENTITY=PASS")})'

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness
        working-directory: source
        run: npm run check:pilot-readiness

      - name: Release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D04 suite
        working-directory: source
        run: node --experimental-strip-types --test tests/d04-invoice-cost-position.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: D04 governance assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "EMCORE_D04_INVOICE_COST_POSITION_V1" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "billedActualNeverUsedAsExpectedAuthority: true" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "semanticLayersSeparated: true" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "latestInvoiceWins: false" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "cleanCostIsLegalTariff: false" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "d16OwnsCrossOpportunityAggregation: true" packages/rules/src/governed-invoice-cost-position.ts
          grep -q "enable row level security" supabase/migrations/20260922190000_d04_invoice_cost_position.sql
          grep -q "app_private.is_active_org_member" supabase/migrations/20260922190000_d04_invoice_cost_position.sql
          grep -q "commodity text not null check (commodity in ('EE','GAS'))" supabase/migrations/20260922190000_d04_invoice_cost_position.sql
          grep -q 'data-d04-invoice-control="v1"' apps/web/src/D04InvoiceControlPanel.tsx
          grep -q "BILLED_CONSUMPTION" tests/d04-invoice-cost-position.test.ts
          ! git diff 8a99c4a3b6f6737f32e9ddb98e54a40f30c58f3c..HEAD | grep -Ei 'DOCUMENT_INGESTION_ENABLED *= *true|customer onboarding|stripe|payment_provider'
          echo "POWER_GAS_PARITY=PASS"
          echo "TENANT_RLS=PASS"
          echo "NO_CUSTOMER_DATA=PASS"
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
