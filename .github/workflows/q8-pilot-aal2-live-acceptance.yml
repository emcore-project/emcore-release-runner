name: EMCORE Q8 PILOT AAL2 Live Acceptance

on:
  push:
    branches: [main]
    paths:
      - q8-aal2-request.json
      - .github/workflows/q8-pilot-aal2-live-acceptance.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: emcore-q8-pilot-aal2
  cancel-in-progress: false

jobs:
  aal2-live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate Q8 request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('q8-aal2-request.json','utf8'));
          const required = {
            schema: 'emcore.q8-aal2-request.v1',
            mode: 'ACCEPT',
            source_repository: 'emcore-project/emcore',
            source_commit: '102b857ca95fe292cb8333d3d2fce0512fe73213',
            source_tree: '9ee81e07185c7dad304e322abddd1af0bbe9a896',
            expected_open_pr_count: 0,
            pilot_base_url: 'https://emcore-web-pilot.emcore-project.workers.dev',
            pilot_bootstrap_url: 'https://qogvvvqqkipmstajvhzl.supabase.co/functions/v1/emcore-live-pilot-smoke-bootstrap',
            live_cloudflare_commit: '9441f5af2fd89de334cde7f9d465eb97bdc8fe93',
            customer_data_allowed: false,
            ingestion_must_remain_disabled: true
          };
          for (const [k,v] of Object.entries(required)) {
            if (r[k] !== v) throw new Error('q8 request mismatch for '+k);
          }
          NODE

      - name: Require source token
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: test -n "$EMCORE_SOURCE_TOKEN"

      - name: Checkout exact private EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 102b857ca95fe292cb8333d3d2fce0512fe73213
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and zero open PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          cd source
          test "$(git rev-parse HEAD)" = "102b857ca95fe292cb8333d3d2fce0512fe73213"
          test "$(git rev-parse 'HEAD^{tree}')" = "9ee81e07185c7dad304e322abddd1af0bbe9a896"
          cd ..
          count="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')"
          test "$count" = "0"
          echo "SOURCE_IDENTITY=PASS"
          echo "OPEN_PR_COUNT=0"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install exact source dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reverify public live Cloudflare identity before auth acceptance
        shell: bash
        run: |
          node <<'NODE'
          const expected='9441f5af2fd89de334cde7f9d465eb97bdc8fe93';
          const r=await fetch('https://emcore-web-pilot.emcore-project.workers.dev/api/deployment-identity',{headers:{accept:'application/json'}});
          if(!r.ok) throw new Error('deployment identity HTTP '+r.status);
          const b=await r.json();
          if(b.commitSha!==expected) throw new Error('live Cloudflare commit drift');
          console.log('LIVE_CLOUDFLARE_IDENTITY=PASS');
          NODE

      - name: Run automated synthetic AAL2 acceptance
        working-directory: source
        env:
          EMCORE_PILOT_BASE_URL: https://emcore-web-pilot.emcore-project.workers.dev
          EMCORE_PILOT_BOOTSTRAP_URL: https://qogvvvqqkipmstajvhzl.supabase.co/functions/v1/emcore-live-pilot-smoke-bootstrap
          EMCORE_PILOT_EXPECTED_COMMIT: 9441f5af2fd89de334cde7f9d465eb97bdc8fe93
        run: npm run test:pilot:aal2

      - name: Terminal acceptance record
        shell: bash
        run: |
          echo "Q8_AAL2_ACCEPTANCE=PASS"
          echo "CUSTOMER_DATA_MUTATION=NONE"
          echo "CLOUDFLARE_MUTATION=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
