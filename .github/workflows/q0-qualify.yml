name: EMCORE Q0 Qualify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - release-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q0-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Read and validate release request
        id: request
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const request = JSON.parse(fs.readFileSync('release-request.json', 'utf8'));
          const required = {
            schema: 'emcore.release-request.v1',
            source_repository: 'emcore-project/emcore',
            release_commit: 'f57337c622d533a0200e51fcdf798deae5130754',
            release_tree: 'cd36bfbf4dc333b8d144b847ab13e169e183eae9',
            expected_open_pr_count: 0,
            deployment_authorized: false,
            cloudflare_access_authorized: false,
          };
          for (const [key, value] of Object.entries(required)) {
            if (request[key] !== value) {
              throw new Error(`release-request mismatch for ${key}`);
            }
          }
          if (!['IDLE', 'QUALIFY'].includes(request.mode)) {
            throw new Error('release-request mode must be IDLE or QUALIFY');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${request.mode}\n`);
          NODE

      - name: Stop safely while IDLE
        if: steps.request.outputs.mode == 'IDLE'
        shell: bash
        run: echo "Q0 is prepared but not activated. No secret was read and no deployment was attempted."

      - name: Require source token for QUALIFY
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          test -n "$EMCORE_SOURCE_TOKEN" || {
            echo "EMCORE_SOURCE_TOKEN is missing; fail closed."
            exit 1
          }

      - name: Checkout exact private EMCORE source
        if: steps.request.outputs.mode == 'QUALIFY'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: f57337c622d533a0200e51fcdf798deae5130754
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        working-directory: source
        run: |
          actual_commit="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_commit" = "f57337c622d533a0200e51fcdf798deae5130754" || {
            echo "Commit mismatch; fail closed."
            exit 1
          }
          test "$actual_tree" = "cd36bfbf4dc333b8d144b847ab13e169e183eae9" || {
            echo "Tree mismatch; fail closed."
            exit 1
          }
          echo "Exact source identity verified."

      - name: Verify zero open pull requests
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          count="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(String(JSON.parse(s).length)))')"
          test "$count" = "0" || {
            echo "Open pull requests detected; fail closed."
            exit 1
          }
          echo "Open pull request count verified at zero."

      - name: Set up Node
        if: steps.request.outputs.mode == 'QUALIFY'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install source dependencies
        if: steps.request.outputs.mode == 'QUALIFY'
        working-directory: source
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run canonical predeploy gate without deployment
        if: steps.request.outputs.mode == 'QUALIFY'
        working-directory: source
        shell: bash
        env:
          EMCORE_RELEASE_COMMIT: f57337c622d533a0200e51fcdf798deae5130754
          EMCORE_RELEASE_TREE: cd36bfbf4dc333b8d144b847ab13e169e183eae9
          EMCORE_OPEN_RELEASE_PRS: '0'
          EMCORE_C6_ACCEPTED: 'true'
          EMCORE_C7_ACCEPTED: 'true'
          EMCORE_G9_ACCEPTED: 'true'
          EMCORE_WAVE1_ACCEPTED: 'true'
          EMCORE_WAVE2_ACCEPTED: 'true'
          EMCORE_ZERO_COST_VERIFIED: 'true'
        run: npm run check:release-predeploy

      - name: Q0 qualification complete
        if: steps.request.outputs.mode == 'QUALIFY'
        shell: bash
        run: |
          echo "Q0 PASS: public runner executed, private exact-SHA source was read, and canonical predeploy gates passed."
          echo "No Cloudflare credential was referenced. No deployment was attempted."
