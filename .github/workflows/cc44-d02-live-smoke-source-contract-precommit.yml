name: CC44 D02 Live Smoke Source Contract Precommit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cc44-d02-live-smoke-source-contract-precommit.yml'

permissions:
  contents: read

concurrency:
  group: emcore-cc44-d02-live-smoke-source-contract-precommit
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact EMCORE pre-correction head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: e7066bbea9537a596f806a76420ee0dca6c9ceee
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact baseline and PR identity
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e7066bbea9537a596f806a76420ee0dca6c9ceee"
          test "$(git rev-parse 'HEAD^{tree}')" = "e5de6552138288ff0959f475b11b5acb95d39c5d"
          git cat-file -e ca224673f3a94227a85ba1303a420a18b726673a^{commit}
          test "$(git diff --name-only ca224673f3a94227a85ba1303a420a18b726673a..HEAD | wc -l)" -eq 18
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1094||p[0].head.sha!=="e7066bbea9537a596f806a76420ee0dca6c9ceee"||p[0].base.sha!=="ca224673f3a94227a85ba1303a420a18b726673a")process.exit(2);console.log("OPEN_PR_IDENTITY=PASS")})'

      - name: Apply proposed one-file test-contract correction in runner workspace only
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const p = 'tests/live-dev-smoke-source-contract.test.ts';
          const src = fs.readFileSync(p, 'utf8');
          const before = `test('live smoke harnesses contain no retired sign-out or five-area contract', () => {
            for (const source of [authenticated, dossier]) {
              assert.doesNotMatch(source, /\\.sign-out/);
              assert.doesNotMatch(source, /five-area/i);
              assert.match(source, /\\.account-trigger/);
              assert.match(source, /\\.account-popover/);
              assert.match(source, /\\.account-sign-out/);
              assert.match(source, /Verifiche/);
              assert.match(source, /Decisioni e azioni/);
              assert.match(source, /Valore EMCORE/);
            }
          });`;
          const after = `test('live smoke harnesses preserve common account/value contracts and their governed per-harness navigation labels', () => {
            for (const source of [authenticated, dossier]) {
              assert.doesNotMatch(source, /\\.sign-out/);
              assert.doesNotMatch(source, /five-area/i);
              assert.match(source, /\\.account-trigger/);
              assert.match(source, /\\.account-popover/);
              assert.match(source, /\\.account-sign-out/);
              assert.match(source, /Valore EMCORE/);
            }

            assert.match(authenticated, /endsWith\\('Verifiche'\\)/);
            assert.match(authenticated, /endsWith\\('Decisioni e azioni'\\)/);

            assert.match(dossier, /endsWith\\('Analisi'\\)/);
            assert.match(dossier, /endsWith\\('Azioni'\\)/);
            assert.doesNotMatch(dossier, /endsWith\\('Verifiche'\\)/);
            assert.doesNotMatch(dossier, /endsWith\\('Decisioni e azioni'\\)/);
          });`;
          if (!src.includes(before)) throw new Error('stale assertion block not found exactly');
          if (src.split(before).length - 1 !== 1) throw new Error('stale assertion block is not unique');
          fs.writeFileSync(p, src.replace(before, after));
          NODE
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "tests/live-dev-smoke-source-contract.test.ts"
          git diff --check
          echo "MISSION_PATCH_BOUNDARY=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Corrected live smoke source-contract test
        working-directory: source
        run: node --experimental-strip-types --test tests/live-dev-smoke-source-contract.test.ts

      - name: Focused D02 suite
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/d02-energy-manager-completeness.test.ts \
            tests/supply-profile-facts.test.ts \
            tests/sii-check-pod-d02.test.ts \
            tests/gas-rcu-fields.test.ts \
            tests/gas-rcu-commercial-capacity-semantics.test.ts \
            tests/gas-rcu-commercial-settlement-semantics.test.ts

      - name: Full canonical npm run check
        working-directory: source
        run: npm run check

      - name: Full npm test
        working-directory: source
        run: npm test

      - name: Final correction contract and boundary
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "tests/live-dev-smoke-source-contract.test.ts"
          git diff --check
          grep -Fq "assert.match(authenticated, /endsWith\\('Verifiche'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          grep -Fq "assert.match(authenticated, /endsWith\\('Decisioni e azioni'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          grep -Fq "assert.match(dossier, /endsWith\\('Analisi'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          grep -Fq "assert.match(dossier, /endsWith\\('Azioni'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          grep -Fq "assert.doesNotMatch(dossier, /endsWith\\('Verifiche'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          grep -Fq "assert.doesNotMatch(dossier, /endsWith\\('Decisioni e azioni'\\)/);" tests/live-dev-smoke-source-contract.test.ts
          echo "LIVE_SMOKE_SOURCE_CONTRACT=PASS"
          echo "NO_APPLICATION_SOURCE_MUTATION=PASS"
          echo "NO_MERGE=PASS"
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
