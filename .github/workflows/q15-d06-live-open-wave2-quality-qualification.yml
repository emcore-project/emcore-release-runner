name: EMCORE Q15 D06 Live Open Wave2 Quality Qualification

on:
  push:
    branches: [main]
    paths:
      - q15-d06-live-open-wave2-quality-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q15-d06-live-open-wave2-quality
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q15-d06-live-open-wave2-quality-request.json');
          const expected = {
            schema: 'emcore.q15-d06-live-open-wave2-quality.v1',
            mode: 'QUALIFY',
            source_repository: 'emcore-project/emcore',
            source_commit: '097c33b7a80f7ba15f0712ceaac97e573e0d3c6f',
            pr_number: 1066,
            live_open_source_access_authorized: true,
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            customer_data_authorized: false,
            customer_ingestion_authorized: false,
            deployment_authorized: false,
            restricted_training_calibration_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q15 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 097c33b7a80f7ba15f0712ceaac97e573e0d3c6f
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "097c33b7a80f7ba15f0712ceaac97e573e0d3c6f"
          test -z "$(git status --porcelain)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SOURCE_IDENTITY=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D06 Wave2 tests
        working-directory: source
        run: node --experimental-strip-types --test tests/source-intelligence-live-open-adapters.test.ts tests/source-intelligence-v2.test.ts tests/market-fundamentals-v1.test.ts tests/market-opportunities-dev-surface.test.ts tests/portal-navigation.test.ts

      - name: Controlled live source smoke EDF and ECB
        working-directory: source
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { acquireEdfNuclearAvailability, acquireEcbEurUsd } from './packages/server/src/source-intelligence-live-open-adapters.ts';
          const edf = await acquireEdfNuclearAvailability();
          if (!edf.payload.length) throw new Error('EDF live smoke returned no records');
          console.log('EDF_LIVE_SMOKE=PASS', edf.sourcePeriod, edf.payload.length);
          const ecb = await acquireEcbEurUsd();
          if (!ecb.payload.length) throw new Error('ECB live smoke returned no records');
          console.log('ECB_LIVE_SMOKE=PASS', ecb.sourcePeriod, ecb.payload.length);
          NODE

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert bounded isolation
        shell: bash
        run: |
          echo "LIVE_OPEN_SOURCE_ACCESS=AUTHORIZED_BOUNDED"
          echo "LIVE_OPEN_DATASETS=NASA_POWER_WEATHER,SODIR_GAS_SUPPLY,NVE_HYDRO,EDF_NUCLEAR_AVAILABILITY,ECB_MACRO_FX"
          echo "RUNTIME_AUTOMATIC_LIVE_FETCHING=OFF"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "CUSTOMER_INGESTION=NONE"
          echo "DEPLOYMENT=NONE"
          echo "RESTRICTED_TRAINING_CALIBRATION=NONE"
          echo "ZERO_COST=PASS"
          echo "Q15_D06_LIVE_OPEN_WAVE2_QUALITY=PASS"
