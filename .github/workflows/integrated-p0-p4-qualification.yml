name: Integrated P0-P4 Product Preview Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/integrated-p0-p4-qualification.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Harness boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" = "main"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          test "$changed" = ".github/workflows/integrated-p0-p4-qualification.yml"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 42e511f88145f5706704f2b06b7c90bd75dea78e
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact integrated source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "42e511f88145f5706704f2b06b7c90bd75dea78e"
          test "$(git rev-parse 'HEAD^{tree}')" = "d58caf8d9620848697ab0871ec48e8e5b1979e36"
          changed="$(git diff --name-only a9262889d1880bc4a626a86284e4606982bf30f5..HEAD)"
          expected="$(printf '%s\n' 'apps/web/src/ProductPreviewV02App.tsx' 'apps/web/src/product-preview-v02.css' 'apps/web/src/product-preview-visual-v13.css')"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"
          echo "INTEGRATED_EXACT_SOURCE=PASS"

      - name: Verify approved Forniture and governed sources immutable
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for f in             apps/web/src/FornitureV04Cleanroom.tsx             apps/web/src/forniture-v04-cleanroom.css             apps/web/src/portal-navigation.ts             apps/web/src/product-preview-data.ts             apps/web/src/portal-data-source.ts             apps/web/src/workspace-source.ts             apps/web/src/product-preview-technical-facts.ts
          do
            git diff --quiet a9262889d1880bc4a626a86284e4606982bf30f5..HEAD -- "$f"
          done
          echo "APPROVED_FORNITURE_GOVERNED_SOURCES_IMMUTABLE=PASS"

      - name: Verify full Product Preview section contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/ProductPreviewV02App.tsx"
          for label in             "Inizio"             "Documenti"             "Forniture"             "Controlli"             "Cosa fare"             "Mercato e offerte"             "Pratiche"             "Scadenze"             "Agevolazioni"
          do
            grep -q "label: '$label'" "$f"
          done
          for wrapper in page--home page--documents page--controls page--actions page--expert
          do
            grep -q "$wrapper" "$f"
          done
          grep -q "import './product-preview-visual-v13.css';" "$f"
          grep -q "return <FornitureV04Cleanroom" "$f"
          echo "ALL_NINE_SECTIONS_PRESENT=PASS"
          echo "P0_P4_PROPAGATION_WIRING=PASS"

      - name: Verify cumulative P0-P4 CSS contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/product-preview-v02.css"
          grep -q "P1 SHELL / CHROME PILOT" "$f"
          grep -q "P2 INIZIO + DOCUMENTI" "$f"
          grep -q "P3 CONTROLLI + COSA FARE" "$f"
          grep -q "P4 EXPERT / DOMAIN SURFACES" "$f"
          grep -q ".emcore-v02__page--home" "$f"
          grep -q ".emcore-v02__page--documents" "$f"
          grep -q ".emcore-v02__page--controls" "$f"
          grep -q ".emcore-v02__page--actions" "$f"
          grep -q ".emcore-v02__page--expert" "$f"
          echo "CUMULATIVE_P0_P4_CSS=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Verify integrated runtime bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist
          grep -R -q -- ".emcore-v02__page--home" apps/web/dist
          grep -R -q -- ".emcore-v02__page--documents" apps/web/dist
          grep -R -q -- ".emcore-v02__page--controls" apps/web/dist
          grep -R -q -- ".emcore-v02__page--actions" apps/web/dist
          grep -R -q -- ".emcore-v02__page--expert" apps/web/dist
          grep -R -q -- "--emcore-v13-shell-sidebar" apps/web/dist
          echo "INTEGRATED_RUNTIME_BUNDLE=PASS"

      - name: Governed safety boundary
        shell: bash
        run: |
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_FORNITURE_REWIRE=PASS"
          echo "NO_DOMAIN_DATA_AUTH_RLS_SCHEMA_MUTATION=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "INTEGRATED_P0_P4=QUALIFICATION_PASS"
