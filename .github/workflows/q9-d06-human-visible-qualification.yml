name: EMCORE Q9 D06 Human Visible Qualification

on:
  push:
    branches: [main]
    paths:
      - q9-d06-human-visible-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q9-d06-human-visible
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate repository-only request
        run: |
          node <<'NODE'
          const r = require('./q9-d06-human-visible-request.json');
          const expected = {
            schema: 'emcore.q9-d06-human-visible.v1',
            mode: 'QUALIFY',
            source_repository: 'emcore-project/emcore',
            source_commit: 'b7e8741bc76e3323990272028ba76468d6ccfe6a',
            source_tree: '0ea2d6144af6d348e4160eef19e0ad38b5f9cc7a',
            provider_access_authorized: false,
            deployment_authorized: false,
            customer_data_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q9 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: b7e8741bc76e3323990272028ba76468d6ccfe6a
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source identity
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "b7e8741bc76e3323990272028ba76468d6ccfe6a"
          test "$(git rev-parse 'HEAD^{tree}')" = "0ea2d6144af6d348e4160eef19e0ad38b5f9cc7a"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Focused D06 surface tests
        working-directory: source
        run: node --experimental-strip-types --test tests/forward-scenario-engine.test.ts tests/market-opportunities-dev-surface.test.ts tests/portal-navigation.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: Release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Assert isolation
        run: |
          echo "PROVIDER_ACCESS=NONE"
          echo "DEPLOYMENT=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "ZERO_COST=PASS"
          echo "Q9_D06_HUMAN_VISIBLE=PASS"
