name: EMCORE CC34 Commercial Control Plane Qualification

on:
  push:
    branches: [main]
    paths:
      - cc34-commercial-control-plane-qualification-request.json

permissions:
  contents: read

concurrency:
  group: emcore-cc34-commercial-control-plane-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./cc34-commercial-control-plane-qualification-request.json');
          const expected = {
            schema: 'emcore.cc34-commercial-control-plane-qualification.v1',
            mode: 'QUALIFY',
            mission: 'CC34-W4-COMMERCIAL-CONTROL-PLANE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '6bd6a9636bc3bdc232c78e37c939f1533c469509',
            source_tree: '25c6732155ab5cf32bf2d22986da35540fb25c2b',
            source_baseline: '3f5063c1bad543fc48347c472148f024b29dd583',
            source_pr: 1090,
            expected_open_pr_count: 1,
            deployment_authorized: false,
            customer_data_authorized: false,
            onboarding_authorized: false,
            ingestion_enablement_authorized: false,
            outreach_authorized: false,
            payment_provider_authorized: false,
            partner_remuneration_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('CC34 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 6bd6a9636bc3bdc232c78e37c939f1533c469509
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6bd6a9636bc3bdc232c78e37c939f1533c469509"
          test "$(git rev-parse 'HEAD^{tree}')" = "25c6732155ab5cf32bf2d22986da35540fb25c2b"
          git cat-file -e 3f5063c1bad543fc48347c472148f024b29dd583^{commit}
          changed="$(git diff --name-only 3f5063c1bad543fc48347c472148f024b29dd583..HEAD)"
          echo "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/governed-commercial-control-plane\.ts|tests/governed-commercial-control-plane\.test\.ts)$' || true)"
          test -z "$unexpected"
          count="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); if(p.length!==1||p[0].number!==1090||p[0].head.sha!=="6bd6a9636bc3bdc232c78e37c939f1533c469509") process.exit(2); process.stdout.write("1")})')"
          test "$count" = "1"
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused commercial control plane qualification
        working-directory: source
        run: node --experimental-strip-types --test tests/governed-commercial-control-plane.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert safety boundaries
        working-directory: source
        shell: bash
        run: |
          ! git diff --name-only 3f5063c1bad543fc48347c472148f024b29dd583..HEAD | grep -E '(^supabase/|migration|rls|wrangler|cloudflare|payment|stripe|partner.*remuner|outreach)' 
          grep -q "governed-commercial-control-plane" tests/governed-commercial-control-plane.test.ts
          echo "CC34_COMMERCIAL_CONTROL_PLANE_QUALIFICATION=PASS"
          echo "DEPLOYMENT_MUTATION=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "ONBOARDING=NONE"
          echo "INGESTION_ENABLEMENT=NONE"
          echo "OUTREACH=NONE"
          echo "PAYMENT_PROVIDER=NONE"
          echo "PARTNER_REMUNERATION=NONE"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
