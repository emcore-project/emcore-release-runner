name: Full Product Forniture Fidelity Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-product-forniture-fidelity.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout qualification harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Harness boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          test "$changed" = ".github/workflows/full-product-forniture-fidelity.yml"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: ec7b28bb31d404d5a4f72259eec9638ad7e169e7
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source and bounded remediation diff
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ec7b28bb31d404d5a4f72259eec9638ad7e169e7"
          test "$(git rev-parse 'HEAD^{tree}')" = "e9d4cdbdbe47ef76b6a5d49c6f01d1948259d1d6"
          changed="$(git diff --name-only 42e511f88145f5706704f2b06b7c90bd75dea78e..HEAD)"
          expected="$(printf '%s\n' 'apps/web/src/ProductPreviewV02App.tsx' 'apps/web/src/product-preview-v02.css')"
          test "$changed" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Verify Forniture and governed sources immutable
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          for f in             apps/web/src/FornitureV04Cleanroom.tsx             apps/web/src/forniture-v04-cleanroom.css             apps/web/src/product-preview-visual-v13.css             apps/web/src/portal-navigation.ts             apps/web/src/product-preview-data.ts             apps/web/src/portal-data-source.ts             apps/web/src/workspace-source.ts             apps/web/src/product-preview-technical-facts.ts
          do
            git diff --quiet 42e511f88145f5706704f2b06b7c90bd75dea78e..HEAD -- "$f"
          done

      - name: Verify Forniture-fidelity structural contract
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          tsx="apps/web/src/ProductPreviewV02App.tsx"
          css="apps/web/src/product-preview-v02.css"
          grep -q 'emcore-v02__brand-orbit' "$tsx"
          grep -q 'emcore-v02__brand-e' "$tsx"
          grep -q 'emcore-v02__brand-pulse' "$tsx"
          grep -q '<Icon name={item.icon}' "$tsx"
          grep -q 'Energia sotto controllo,' "$tsx"
          grep -q 'emcore-v02__utility-popover' "$tsx"
          grep -q 'Utente demo' "$tsx"
          grep -q 'Energy Manager' "$tsx"
          grep -q 'function State' "$tsx"
          grep -q 'emcore-v02__state-icon' "$tsx"
          grep -q 'FULL PRODUCT FORNITURE-FIDELITY V1' "$css"
          grep -q 'background:linear-gradient(180deg,#08243d 0%,#071d33 52%,#061727 100%)' "$css"
          grep -q 'background:#174f78' "$css"
          grep -q 'grid-template-columns:3.5rem minmax(0,1fr)' "$css"
          grep -q 'background:linear-gradient(180deg,var(--ff-header-start),var(--ff-header-end))' "$css"
          grep -q 'background:linear-gradient(90deg,#edf5fa,#f4f9fc)' "$css"
          grep -q '@media(max-width:1050px)' "$css"
          echo "FORNITURE_FIDELITY_STRUCTURE=PASS"

      - name: Verify section and data contract retained
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          f="apps/web/src/ProductPreviewV02App.tsx"
          for label in "Inizio" "Documenti" "Forniture" "Controlli" "Cosa fare" "Mercato e offerte" "Pratiche" "Scadenze" "Agevolazioni"; do
            grep -q "label: '$label'" "$f"
          done
          grep -q 'return <FornitureV04Cleanroom' "$f"
          echo "ALL_NINE_SECTIONS_RETAINED=PASS"

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Verify runtime bundle fidelity markers
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/web/dist
          grep -R -q -- ".emcore-v02__brand-orbit" apps/web/dist
          grep -R -q -- ".emcore-v02__sidebar-tagline" apps/web/dist
          grep -R -q -- ".emcore-v02__state-icon" apps/web/dist
          grep -R -q -- "--ff-header-start" apps/web/dist

      - name: Governed safety boundary
        shell: bash
        run: |
          echo "NO_FORNITURE_MUTATION=PASS"
          echo "NO_DOMAIN_DATA_AUTH_RLS_SCHEMA_MUTATION=PASS"
          echo "NO_MAIN_MUTATION=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_INCREMENTAL_COST=PASS"
          echo "FORNITURE_FIDELITY_REMEDIATION=QUALIFICATION_PASS"
