name: CC47 D05 Mission Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cc47-d05-mission-qualification.yml'

permissions:
  contents: read

concurrency:
  group: emcore-cc47-d05-mission-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prove runner allocation
        run: echo "RUNNER_ALLOCATION=PASS"

      - name: Checkout exact EMCORE source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 5b03c698f4b0cf98129141cf61623b9a2631bc25
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact identity and D05 boundary
        working-directory: source
        shell: bash
        env:
          EMCORE_SOURCE_TOKEN: ${{ secrets.EMCORE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5b03c698f4b0cf98129141cf61623b9a2631bc25"
          test "$(git rev-parse 'HEAD^{tree}')" = "bd1388a1141dfabbdc83040386bb4acf8f2d4da8"
          git cat-file -e b89015acfb07b445505e9f116551ff51fbb69abd^{commit}
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const expected = [
            'apps/web/src/D05ContractPositionPanel.tsx',
            'apps/web/src/SupplyContractDossier.tsx',
            'packages/domain/src/governed-contract-position.ts',
            'supabase/migrations/20260922170000_d05_contract_intelligence_lifecycle.sql',
            'tests/d05-contract-intelligence-lifecycle.test.ts'
          ].sort();
          const out = execFileSync('git',['diff','--name-only','b89015acfb07b445505e9f116551ff51fbb69abd..HEAD'],{encoding:'utf8'}).trim();
          const actual = out ? out.split('\n').filter(Boolean).sort() : [];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error('D05 boundary mismatch: '+JSON.stringify(actual));
          console.log('D05_SOURCE_SCOPE_BOUNDARY=PASS');
          NODE
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${EMCORE_SOURCE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/emcore-project/emcore/pulls?state=open&per_page=100" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.length!==1||p[0].number!==1096||p[0].head.sha!=="5b03c698f4b0cf98129141cf61623b9a2631bc25"||p[0].base.sha!=="b89015acfb07b445505e9f116551ff51fbb69abd")process.exit(2);console.log("OPEN_PR_IDENTITY=PASS")})'

      - name: Set up Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness
        working-directory: source
        run: npm run check:pilot-readiness

      - name: Release hardening
        working-directory: source
        run: npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D05 suite
        working-directory: source
        run: node --experimental-strip-types --test tests/d05-contract-intelligence-lifecycle.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build web
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance

      - name: D05 governance assertions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "latestDocumentWins: false" packages/domain/src/governed-contract-position.ts
          grep -q "AUTOMATIC_EVOLUTION" packages/domain/src/governed-contract-position.ts
          grep -q "DISCRETIONARY_MODIFICATION" packages/domain/src/governed-contract-position.ts
          grep -q "SELLER_CONFIRMATION" packages/domain/src/governed-contract-position.ts
          grep -q "commodity text not null check (commodity in ('EE','GAS'))" supabase/migrations/20260922170000_d05_contract_intelligence_lifecycle.sql
          grep -q "enable row level security" supabase/migrations/20260922170000_d05_contract_intelligence_lifecycle.sql
          grep -q "app_private.is_active_org_member" supabase/migrations/20260922170000_d05_contract_intelligence_lifecycle.sql
          grep -q 'data-d05-contract-position="v1"' apps/web/src/D05ContractPositionPanel.tsx
          ! git diff b89015acfb07b445505e9f116551ff51fbb69abd..HEAD | grep -Ei 'DOCUMENT_INGESTION_ENABLED *= *true|customer onboarding|stripe|payment_provider'
          echo "POWER_GAS_PARITY=PASS"
          echo "TENANT_RLS=PASS"
          echo "NO_CUSTOMER_DATA=PASS"
          echo "NO_DEPLOYMENT=PASS"
          echo "NO_LIVE_DB_MUTATION=PASS"
          echo "Q29_BYPASS=NONE"
          echo "ZERO_COST=PASS"
