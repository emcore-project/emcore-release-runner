name: EMCORE Q32 D09 Governed Connection Supply Practice Engine Qualification

on:
  push:
    branches: [main]
    paths:
      - q32-d09-governed-connection-supply-practice-engine-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q32-d09-governed-connection-supply-practice-engine
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q32-d09-governed-connection-supply-practice-engine-request.json');
          const expected = {
            schema: 'emcore.q32-d09-governed-connection-supply-practice-engine.v1',
            mode: 'QUALIFY',
            mission: 'CC28-D09-GOVERNED-CONNECTION-SUPPLY-PRACTICE-ENGINE-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '4ea4fa0819d37a086e6b88a0159392b4de3ec4ed',
            source_baseline: 'ddde965bb6860cfe617a1541a701bd43d9bc1f34',
            external_submission_authorized: false,
            seller_distributor_impersonation_authorized: false,
            customer_outreach_authorized: false,
            production_customer_data_enablement_authorized: false,
            proprietary_data_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q32 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 4ea4fa0819d37a086e6b88a0159392b4de3ec4ed
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4ea4fa0819d37a086e6b88a0159392b4de3ec4ed"
          test -z "$(git status --porcelain)"
          git cat-file -e ddde965bb6860cfe617a1541a701bd43d9bc1f34^{commit}
          changed="$(git diff --name-only ddde965bb6860cfe617a1541a701bd43d9bc1f34..HEAD)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/governed-connection-supply-practice-engine\.ts|apps/web/src/GovernedConnectionSupplyPracticeDevSurface\.tsx|apps/web/src/CustomerPortal\.tsx|apps/web/src/portal-navigation\.ts|tests/governed-connection-supply-practice-engine\.test\.ts|tests/governed-connection-supply-practice-dev-surface\.test\.ts)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D09 D08 D07 D06 Q29 regression tests
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/governed-connection-supply-practice-engine.test.ts \
            tests/governed-connection-supply-practice-dev-surface.test.ts \
            tests/governed-fixing-hedging-portfolio-decision.test.ts \
            tests/governed-fixing-hedging-portfolio-dev-panel.test.ts \
            tests/governed-offer-comparison-procurement-decision.test.ts \
            tests/governed-offer-comparison-procurement-dev-panel.test.ts \
            tests/governed-gas-commercial-structure-parity.test.ts \
            tests/market-opportunities-dev-surface.test.ts \
            tests/governed-italy-native-supply-availability.test.ts \
            tests/governed-scenario-market-consistency-orchestration.test.ts \
            tests/r01-governed-distribution-lifecycle-events.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert D09 safety isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          files="packages/domain/src/governed-connection-supply-practice-engine.ts apps/web/src/GovernedConnectionSupplyPracticeDevSurface.tsx"
          ! grep -RE "fetch\(|axios|sendPractice|submitPractice|contactSupplier|contactDistributor|impersonate|setInterval|setTimeout" $files
          grep -q "pointContextAuthority: 'D02_SUPPLY_TECHNICAL_DOSSIER'" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "sourceAuthority: 'D10_OBLIGATION_DEADLINE_ENGINE'" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "preparedIsSubmitted: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "submittedIsAccepted: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "acceptedIsCompleted: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "completionRequiresExplicitEvidence: true" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "automaticExternalSubmissionAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "sellerDistributorImpersonationAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "customerOutreachAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "productionCustomerDataEnablementAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "scrapingAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "paidProprietaryDataAuthorized: false" packages/domain/src/governed-connection-supply-practice-engine.ts
          grep -q "q29ItalyReadinessUnchanged: true" packages/domain/src/governed-connection-supply-practice-engine.ts
          echo "D09_CONNECTION_SUPPLY_PRACTICE_ENGINE=PASS"
          echo "INTENT_FIRST_DIAGNOSIS=PASS"
          echo "D02_D10_D15_REUSE=PASS"
          echo "POWER_GAS_PARITY=PASS"
          echo "PREPARED_SUBMITTED_COMPLETED_SEPARATION=PASS"
          echo "EXTERNAL_SUBMISSION=NONE"
          echo "IMPERSONATION=NONE"
          echo "CUSTOMER_OUTREACH=NONE"
          echo "PRODUCTION_CUSTOMER_DATA=NONE"
          echo "PAID_PROPRIETARY_DATA=NONE"
          echo "SCRAPING=NONE"
          echo "AUTOMATIC_RUNTIME_FETCHING=OFF"
          echo "Q29_READINESS_BYPASS=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q32_D09_GOVERNED_CONNECTION_SUPPLY_PRACTICE_ENGINE=PASS"
