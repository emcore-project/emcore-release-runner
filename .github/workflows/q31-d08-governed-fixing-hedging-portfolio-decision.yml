name: EMCORE Q31 D08 Governed Fixing Hedging Portfolio Decision Qualification

on:
  push:
    branches: [main]
    paths:
      - q31-d08-governed-fixing-hedging-portfolio-decision-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q31-d08-governed-fixing-hedging-portfolio-decision
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q31-d08-governed-fixing-hedging-portfolio-decision-request.json');
          const expected = {
            schema: 'emcore.q31-d08-governed-fixing-hedging-portfolio-decision.v1',
            mode: 'QUALIFY',
            mission: 'CC28-D08-GOVERNED-FIXING-HEDGING-PORTFOLIO-DECISION-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '3144af4fae6e3d0f8ccfe2004ff25a2a3893dc49',
            source_baseline: 'a08dbcabe2d0c29133e3ad4ddd1fc4de7f63b94c',
            fixing_request_transmission_authorized: false,
            supplier_communication_authorized: false,
            trading_execution_authorized: false,
            hedge_execution_authorized: false,
            signature_execution_authorized: false,
            contractual_commitment_authorized: false,
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            q29_bypass_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) {
            if (r[key] !== value) throw new Error('Q31 request mismatch: ' + key);
          }
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 3144af4fae6e3d0f8ccfe2004ff25a2a3893dc49
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "3144af4fae6e3d0f8ccfe2004ff25a2a3893dc49"
          test -z "$(git status --porcelain)"
          git cat-file -e a08dbcabe2d0c29133e3ad4ddd1fc4de7f63b94c^{commit}
          changed="$(git diff --name-only a08dbcabe2d0c29133e3ad4ddd1fc4de7f63b94c..HEAD)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/domain/src/governed-fixing-hedging-portfolio-decision\.ts|apps/web/src/GovernedFixingHedgingPortfolioDevPanel\.tsx|apps/web/src/MarketOpportunitiesDevSurface\.tsx|tests/governed-fixing-hedging-portfolio-decision\.test\.ts|tests/governed-fixing-hedging-portfolio-dev-panel\.test\.ts)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D08 D07 D06 Q29 regression tests
        working-directory: source
        run: |
          node --experimental-strip-types --test             tests/governed-fixing-hedging-portfolio-decision.test.ts             tests/governed-fixing-hedging-portfolio-dev-panel.test.ts             tests/governed-offer-comparison-procurement-decision.test.ts             tests/governed-offer-comparison-procurement-dev-panel.test.ts             tests/governed-gas-commercial-structure-parity.test.ts             tests/market-opportunities-dev-surface.test.ts             tests/governed-italy-native-supply-availability.test.ts             tests/governed-scenario-market-consistency-orchestration.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert D08 safety Q29 isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          files="packages/domain/src/governed-fixing-hedging-portfolio-decision.ts apps/web/src/GovernedFixingHedgingPortfolioDevPanel.tsx"
          ! grep -RE "fetch\(|axios|sendFixing|sendRequest|contactSupplier|executeTrade|executeHedge|executeFixing|executeSignature|signContract|setInterval|setTimeout" $files
          grep -q "lockedPositionDerivedFromSellerConfirmationOnly: true" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "fixingRequestCreatesLockedPosition: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "candidateDecisionCreatesLockedPosition: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "valueState: 'PROSPECTIVE_SCENARIO_ONLY'" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "realizedSavingEur: null" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "automaticFixingRequestTransmissionAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "supplierCommunicationAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "automaticTradingExecutionAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "hedgeExecutionAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "automaticSignatureExecutionAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "automaticContractualCommitmentAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "marketReadinessPromotionAuthorized: false" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "q29ItalyReadinessUnchanged: true" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "D06_POWER_FORWARD_SCENARIO" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          grep -q "D06_GAS_COMMERCIAL_SCENARIO" packages/domain/src/governed-fixing-hedging-portfolio-decision.ts
          echo "D08_FIXING_HEDGING_PORTFOLIO_DECISION=PASS"
          echo "POWER_GAS_PARITY=PASS"
          echo "RIGHT_REQUEST_CONFIRMATION_SEPARATION=PASS"
          echo "RESIDUAL_EXPOSURE=PASS"
          echo "PROSPECTIVE_VALUE_ONLY=PASS"
          echo "DETERMINISTIC_REPLAY=PASS"
          echo "Q29_READINESS_BYPASS=NONE"
          echo "FIXING_REQUEST_TRANSMISSION=NONE"
          echo "SUPPLIER_COMMUNICATION=NONE"
          echo "TRADING_EXECUTION=NONE"
          echo "HEDGE_EXECUTION=NONE"
          echo "SIGNATURE_EXECUTION=NONE"
          echo "CONTRACTUAL_COMMITMENT=NONE"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "AUTOMATIC_RUNTIME_FETCHING=OFF"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q31_D08_GOVERNED_FIXING_HEDGING_PORTFOLIO_DECISION=PASS"
