name: EMCORE Q28 D06 Scenario Market Consistency Orchestration Qualification

on:
  push:
    branches: [main]
    paths:
      - q28-d06-scenario-market-consistency-orchestration-request.json

permissions:
  contents: read

concurrency:
  group: emcore-q28-d06-scenario-market-consistency-orchestration
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release-control repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Validate bounded request
        shell: bash
        run: |
          node <<'NODE'
          const r = require('./q28-d06-scenario-market-consistency-orchestration-request.json');
          const expected = {
            schema: 'emcore.q28-d06-scenario-market-consistency-orchestration.v1',
            mode: 'QUALIFY',
            mission: 'CC26-D06-GOVERNED-SCENARIO-TO-MARKET-CONSISTENCY-ORCHESTRATION-V1-001',
            source_repository: 'emcore-project/emcore',
            source_commit: '4292da9be7f080f76d1641de77e935b14d70a65e',
            source_baseline: 'd37ab06d86b24799d35cafeb0e430c50b45ac1c5',
            proprietary_market_access_authorized: false,
            paid_feed_authorized: false,
            scraping_authorized: false,
            customer_data_authorized: false,
            customer_ingestion_authorized: false,
            deployment_authorized: false,
            automatic_runtime_fetching_authorized: false,
            price_fair_value_engine_authorized: false,
            final_scenario_auto_execution_authorized: false,
            fixing_execution_authorized: false,
            trading_execution_authorized: false,
            automatic_action_execution_authorized: false,
            quantitative_geographic_weighting_authorized: false
          };
          for (const [key, value] of Object.entries(expected)) if (r[key] !== value) throw new Error('Q28 request mismatch: ' + key);
          NODE

      - name: Checkout exact private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: emcore-project/emcore
          ref: 4292da9be7f080f76d1641de77e935b14d70a65e
          token: ${{ secrets.EMCORE_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity and bounded scope
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "4292da9be7f080f76d1641de77e935b14d70a65e"
          test -z "$(git status --porcelain)"
          git cat-file -e d37ab06d86b24799d35cafeb0e430c50b45ac1c5^{commit}
          changed="$(git diff --name-only d37ab06d86b24799d35cafeb0e430c50b45ac1c5..HEAD)"
          echo "$changed"
          test -n "$changed"
          unexpected="$(echo "$changed" | grep -Ev '^(packages/server/src/governed-scenario-market-consistency-orchestration\.ts|tests/governed-scenario-market-consistency-orchestration\.test\.ts|apps/web/src/FundamentalMarketConsistencyDevPanel\.tsx)$' || true)"
          test -z "$unexpected"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)"
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "SCOPE_ISOLATION=PASS"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pilot readiness and release hardening
        working-directory: source
        run: |
          npm run check:pilot-readiness
          npm run check:release-hardening

      - name: Type check
        working-directory: source
        run: npm run check

      - name: Focused D06 orchestration tests
        working-directory: source
        run: |
          node --experimental-strip-types --test \
            tests/governed-scenario-market-consistency-orchestration.test.ts \
            tests/governed-driver-market-geographic-applicability.test.ts \
            tests/governed-fundamental-driver-signal-bundle.test.ts \
            tests/governed-independent-fundamental-scenario-engine.test.ts \
            tests/governed-fundamental-market-consistency-bridge.test.ts \
            tests/governed-market-snapshot-intake.test.ts \
            tests/forward-scenario-engine.test.ts \
            tests/market-opportunities-dev-surface.test.ts \
            tests/portal-navigation.test.ts

      - name: Full test suite
        working-directory: source
        run: npm test

      - name: Build Cloudflare application
        working-directory: source
        run: npm run build --workspace @emcore/web

      - name: Browser acceptance
        working-directory: source
        shell: bash
        run: |
          cat > /tmp/emcore-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --remote-debugging-address=127.0.0.1 "$@"
          EOF
          chmod +x /tmp/emcore-chrome
          if ! CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance; then
            CHROME_PATH=/tmp/emcore-chrome npm run test:browser:acceptance
          fi

      - name: Assert orchestration safety rights isolation and zero-cost guards
        working-directory: source
        shell: bash
        run: |
          ! grep -RE "setInterval\(|fetch\(" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          ! grep -RE "executeTrade|executeFixing|fairValue|priceForecast:" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "buildFundamentalScenarioOnDemand" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "buildGovernedDriverToMarketGeographicApplicability" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "buildGovernedMarketImpliedContext" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "compareFundamentalWithMarket" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "applyConsistencyOverlayToOpportunity" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "evaluateForwardScenario" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "runtimeAutomaticFetching: false" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "finalScenarioAutoExecution: false" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          grep -q "automaticActionExecution: false" packages/server/src/governed-scenario-market-consistency-orchestration.ts
          echo "SCENARIO_MARKET_CONSISTENCY_ORCHESTRATION=PASS"
          echo "POWER_GAS_PARITY=PASS"
          echo "NO_CROSS_BORDER_BYPASS=PASS"
          echo "MARKET_RIGHTS_GATES=PASS"
          echo "EXTERNAL_DISPLAY_SEPARATION=PASS"
          echo "REPLAY_IDENTITY=PASS"
          echo "AUTOMATIC_RUNTIME_FETCHING=OFF"
          echo "FINAL_SCENARIO_AUTO_EXECUTION=OFF"
          echo "PROPRIETARY_MARKET_ACCESS=NONE"
          echo "PAID_FEED=NONE"
          echo "SCRAPING=NONE"
          echo "CUSTOMER_DATA=NONE"
          echo "CUSTOMER_INGESTION=NONE"
          echo "PRICE_FAIR_VALUE_ENGINE=NONE"
          echo "FIXING_EXECUTION=NONE"
          echo "TRADING_EXECUTION=NONE"
          echo "AUTOMATIC_ACTION_EXECUTION=NONE"
          echo "ZERO_COST=PASS"
          echo "ISOLATION=PASS"
          echo "Q28_D06_SCENARIO_MARKET_CONSISTENCY_ORCHESTRATION=PASS"
